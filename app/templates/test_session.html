{% extends "base.html" %}
{% block title %}Test session{% endblock %}
{% block content %}
  <h1>Test</h1>
  {% if notice %}
    <p class="flash">{{ notice }}</p>
  {% endif %}
  {% if not cards_json %}
    <p>No cards match the selected filters.</p>
  {% else %}
    <script id="cards-data" type="application/json">{{ cards_json|tojson }}</script>
    <div id="test-root">
      <ol id="test-blind" class="card-list"></ol>
      <button id="reveal-btn" type="button">Reveal all</button>
      <ol id="test-review" class="card-list" hidden></ol>
    </div>
  {% endif %}
{% endblock %}
{% block scripts %}
  <script>
    (function () {
      const root = document.getElementById("test-root");
      if (!root) return;
      const cards = JSON.parse(document.getElementById("cards-data").textContent);
      const blind = document.getElementById("test-blind");
      const review = document.getElementById("test-review");

      cards.forEach((card, i) => {
        const li = document.createElement("li");
        li.textContent = "Card " + (i + 1) + " of " + cards.length + " (answer hidden)";
        blind.appendChild(li);
      });

      document.getElementById("reveal-btn").addEventListener("click", () => {
        review.innerHTML = "";
        cards.forEach((card) => {
          const li = document.createElement("li");
          li.innerHTML =
            '<div class="question">\\[' + card.question + '\\]</div>' +
            '<div class="answer">\\[' + card.answer + '\\]</div>';
          review.appendChild(li);
        });
        review.hidden = false;
        blind.hidden = true;
        if (window.renderMathInElement) {
          renderMathInElement(review, {
            delimiters: [{left: "\\[", right: "\\]", display: true}],
            macros: window.KATEX_MACROS,
          });
        }
      });
    })();
  </script>
{% endblock %}
