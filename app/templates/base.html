<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Math Flashcards{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('main.index') }}">Home</a>
    <a href="{{ url_for('main.add_cards') }}">Add</a>
    <a href="{{ url_for('main.remove_cards') }}">Remove</a>
    <a href="{{ url_for('main.practice_setup') }}">Practice</a>
    <a href="{{ url_for('main.test_setup') }}">Test</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script id="katex-macros" type="application/json">{{ (macros or {}) | tojson }}</script>
  <script>
    window.KATEX_MACROS = JSON.parse(document.getElementById("katex-macros").textContent);
    // Only allow \includegraphics, and only for images served from our own static/graphs folder.
    window.KATEX_TRUST = (context) =>
      context.command === "\\includegraphics" &&
      typeof context.url === "string" &&
      context.url.startsWith("/static/graphs/");
    document.addEventListener("DOMContentLoaded", () => {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [{left: "\\[", right: "\\]", display: true}],
          macros: window.KATEX_MACROS,
          trust: window.KATEX_TRUST,
        });
      }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
