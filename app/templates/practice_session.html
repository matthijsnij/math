{% extends "base.html" %}
{% block title %}Practice session{% endblock %}
{% block content %}
  <h1>Practice</h1>
  {% if not cards_json %}
    <p>No cards match the selected filters.</p>
  {% else %}
    <script id="cards-data" type="application/json">{{ cards_json|tojson }}</script>
    <div id="practice-root">
      <div class="card">
        <div id="practice-front" class="question"></div>
        <div id="practice-back" class="answer" hidden></div>
      </div>
      <button id="flip-btn" type="button">Flip</button>
      <button id="next-btn" type="button">Next</button>
    </div>
  {% endif %}
{% endblock %}
{% block scripts %}
  <script>
    (function () {
      const root = document.getElementById("practice-root");
      if (!root) return;
      let cards = JSON.parse(document.getElementById("cards-data").textContent);
      let order = [];
      let index = 0;

      function shuffle(list) {
        const copy = list.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function renderMath(el, latex) {
        el.textContent = "";
        const span = document.createElement("span");
        span.textContent = "\\[" + latex + "\\]";
        el.appendChild(span);
        if (window.renderMathInElement) {
          renderMathInElement(el, {
            delimiters: [{left: "\\[", right: "\\]", display: true}],
            macros: window.KATEX_MACROS,
            trust: window.KATEX_TRUST,
          });
        }
      }

      function showCard() {
        if (index >= order.length) {
          order = shuffle(cards);
          index = 0;
        }
        const card = order[index];
        renderMath(document.getElementById("practice-front"), card.question);
        renderMath(document.getElementById("practice-back"), card.answer);
        document.getElementById("practice-back").hidden = true;
      }

      document.getElementById("flip-btn").addEventListener("click", () => {
        const back = document.getElementById("practice-back");
        back.hidden = !back.hidden;
      });
      document.getElementById("next-btn").addEventListener("click", () => {
        index += 1;
        showCard();
      });

      order = shuffle(cards);
      showCard();
    })();
  </script>
{% endblock %}
