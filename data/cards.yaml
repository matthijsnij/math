  question: |
    \text{Evaluate: } \int 2x(x^2+1)^3\,dx
  answer: |
    \begin{aligned}
    &\text{Let } u = x^2+1,\ du = 2x\,dx. \\
    \int 2x(x^2+1)^3\,dx &= \int u^3\,du = \dfrac{u^4}{4} + C = \dfrac{(x^2+1)^4}{4} + C
    \end{aligned}
