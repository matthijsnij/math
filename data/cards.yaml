  level: 1
  question: |
    \text{Express the area between } y=x \text{ and the } x\text{-axis on } [0,4] \text{ as a definite integral, and evaluate it.}
  answer: |
    \begin{aligned}
    \text{Area} &= \int_0^4 x\,dx = \left[\dfrac{x^2}{2}\right]_0^4 \\
    &= \dfrac{16}{2} - 0 = 8
    \end{aligned}
