- id: mathematics-exponents-and-logarithms-2-02
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 2
  question: |
    \text{Solve for } x: \quad 2^{x+1} = 5
  answer: |
    \begin{aligned}
    2^{x+1} &= 5 \\
    (x+1)\ln 2 &= \ln 5 \\
    x &= \dfrac{\ln 5}{\ln 2} - 1
    \end{aligned}
- id: mathematics-exponents-and-logarithms-2-03
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 2
  question: |
    \text{Solve for } x: \quad \log_{10}(x) + \log_{10}(x-3) = 1
  answer: |
    \begin{aligned}
    \log_{10}\big(x(x-3)\big) &= 1 \\
    x(x-3) &= 10 \\
    x^{2} - 3x - 10 &= 0 \\
    (x-5)(x+2) &= 0 \\
    x &= 5 \ \text{or} \ x=-2 \\
    &\text{domain requires } x>3 \text{, so } x=-2 \text{ is extraneous} \\
    x &= 5
    \end{aligned}
- id: mathematics-exponents-and-logarithms-2-04
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 2
  question: |
    \text{A radioactive sample has a half-life of 10 years. How many years until only } \tfrac{1}{8} \text{ of the original amount remains?}
  answer: |
    \begin{aligned}
    \left(\tfrac12\right)^{t/10} &= \tfrac18 = \left(\tfrac12\right)^{3} \\
    t/10 &= 3 \\
    t &= 30 \text{ years}
    \end{aligned}
- id: mathematics-exponents-and-logarithms-2-05
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 2
  question: |
    \text{Solve: } \left(\tfrac12\right)^{x} < \left(\tfrac12\right)^{3}
  answer: |
    \begin{aligned}
    \left(\tfrac12\right)^x &< \left(\tfrac12\right)^3 \\
    x &> 3 \quad \text{(base } 0<b<1 \text{ reverses the inequality)}
    \end{aligned}
- id: mathematics-exponents-and-logarithms-2-06
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 2
  question: |
    \text{pH is defined as } \mathrm{pH} = -\log_{10}[\mathrm{H}^+]. \text{ If pH drops from 7 to 4, by what factor does } [\mathrm{H}^+] \text{ increase?}
  answer: |
    [\mathrm{H}^+] \text{ increases by a factor of } 10^{7-4} = 10^{3} = 1000
- id: mathematics-exponents-and-logarithms-3-01
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 3
  question: |
    \text{Prove: } \log_b(xy) = \log_b(x) + \log_b(y) \quad (x,y>0,\ b>0,\ b\neq1)
  answer: |
    \begin{aligned}
    \text{let } m &= \log_b(x), \ n = \log_b(y), \quad \text{so } b^m = x, \ b^n = y \\
    xy &= b^m \cdot b^n = b^{m+n} \\
    \text{by the definition of log, } \log_b(xy) &= m+n = \log_b(x) + \log_b(y)
    \end{aligned}
- id: mathematics-exponents-and-logarithms-3-02
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 3
  question: |
    \text{Derive the change-of-base formula: } \log_b(x) = \dfrac{\log_c(x)}{\log_c(b)} \quad (b,c>0,\ b,c\neq1,\ x>0)
  answer: |
    \begin{aligned}
    \text{let } y &= \log_b(x), \quad \text{so } b^y = x \\
    \log_c(b^y) &= \log_c(x) \\
    y \log_c(b) &= \log_c(x) \quad \text{(power rule)} \\
    y &= \dfrac{\log_c(x)}{\log_c(b)}, \quad \text{i.e. } \log_b(x) = \dfrac{\log_c(x)}{\log_c(b)}
    \end{aligned}
- id: mathematics-exponents-and-logarithms-3-03
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 3
  question: |
    \text{For } a \neq 0, \text{ prove that consistency with the exponent law } a^{m-n} = \dfrac{a^m}{a^n} \text{ forces } a^{0} = 1.
  answer: |
    \begin{aligned}
    \text{set } m&=n \text{ in the law: } a^{m-m} = \dfrac{a^m}{a^m} \\
    a^{0} &= \dfrac{a^m}{a^m} = 1 \quad \text{(valid since } a^m \neq 0 \text{ for } a \neq 0\text{)} \\
    &\text{this holds for every } m\text{, so } a^0=1 \text{ is the only value consistent with the law}
    \end{aligned}
- id: mathematics-exponents-and-logarithms-3-04
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 3
  question: |
    \text{Prove that } \log_b(x) \text{ is strictly increasing on } (0,\infty) \text{ when } b>1, \text{ and strictly decreasing when } 0<b<1.
  answer: |
    \begin{aligned}
    &\text{case } b>1: \text{ let } x_1 < x_2, \ t_i = \log_b(x_i), \text{ so } b^{t_i}=x_i \\
    &\text{since } b>1, \ b^{\epsilon} \geq 1 \text{ for } \epsilon \geq 0, \text{ so } s \mapsto b^s \text{ is non-decreasing} \\
    &\text{if } t_1 \geq t_2 \text{ this gives } x_1 \geq x_2, \text{ contradicting } x_1<x_2 \\
    &\text{so } t_1 < t_2, \text{ i.e. } \log_b \text{ is strictly increasing} \\
    &\text{case } 0<b<1: \ b^{\epsilon}<1 \text{ for } \epsilon>0, \text{ so } s \mapsto b^s \text{ is strictly decreasing} \\
    &\text{the mirrored argument gives } \log_b(x_1) > \log_b(x_2) \text{ whenever } x_1<x_2: \text{ strictly decreasing}
    \end{aligned}
- id: mathematics-exponents-and-logarithms-4-01
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 4
  question: |
    \text{How many digits does } 2^{1000} \text{ have? (Use } \log_{10}2 \approx 0.30103.)
  answer: |
    \begin{aligned}
    \text{digits}(N) &= \lfloor \log_{10}N \rfloor + 1 \quad \text{for positive integer } N \\
    \log_{10}(2^{1000}) &= 1000 \cdot \log_{10}2 \approx 1000 \times 0.30103 = 301.03 \\
    \text{digits} &= \lfloor 301.03 \rfloor + 1 = 302
    \end{aligned}
- id: mathematics-exponents-and-logarithms-4-02
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 4
  question: |
    \text{Given } \log_{10}2 \approx 0.301 \text{ and } \log_{10}3 \approx 0.477, \text{ estimate } \log_{10}5 \text{ without a calculator.}
  answer: |
    \begin{aligned}
    \log_{10}5 &= \log_{10}\!\left(\dfrac{10}{2}\right) = \log_{10}10 - \log_{10}2 \\
    &= 1 - 0.301 = 0.699
    \end{aligned}
- id: mathematics-exponents-and-logarithms-4-03
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 4
  question: |
    \text{Investment A doubles every 6 years. Investment B compounds continuously at an annual rate of 10\%. Both start at the same value } V_0. \text{ After 20 years, which is worth more, and by what ratio (A:B)?}
  answer: |
    \begin{aligned}
    A(t) &= V_0 \cdot 2^{t/6} = V_0\, e^{(\ln 2/6)\,t}, \quad B(t) = V_0\, e^{0.1t} \\
    \dfrac{A(t)}{B(t)} &= e^{\left(\frac{\ln 2}{6}-0.1\right)t}, \quad \dfrac{\ln 2}{6} \approx \dfrac{0.6931}{6} \approx 0.1155 \\
    \dfrac{A(20)}{B(20)} &= e^{(0.1155-0.1)\cdot 20} = e^{0.310} \approx 1.36 \\
    &\text{A is worth more, by a ratio of about } 1.36:1
    \end{aligned}
- id: mathematics-exponents-and-logarithms-4-04
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 4
  question: |
    \text{Solve for } x,y>0 \text{ with } x \neq y: \quad x^{y}=y^{x} \text{ and } y=2x.
  answer: |
    \begin{aligned}
    x^y &= y^x \ \Rightarrow\ y\ln x = x\ln y \\
    \text{substitute } y&=2x: \quad 2x\ln x = x\ln(2x) \\
    \text{divide by } x: \quad 2\ln x &= \ln 2 + \ln x \ \Rightarrow\ \ln x = \ln 2 \ \Rightarrow\ x=2 \\
    y&=2x=4 \quad \text{(check: } 2^4=16=4^2\text{)}
    \end{aligned}
- id: mathematics-functions-and-graphs-1-01
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Find the domain of } f(x) = \dfrac{\sqrt{x+3}}{x-2}.
  answer: |
    \begin{aligned}
    &\text{Need } x+3 \ge 0 \text{ and } x-2 \neq 0 \\
    &\Rightarrow x \ge -3 \text{ and } x \neq 2 \\
    &\text{Domain: } [-3,2)\cup(2,\infty)
    \end{aligned}
- id: mathematics-functions-and-graphs-1-02
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Find the range of } f(x) = -2(x-1)^{2}+5.
  answer: |
    \text{Vertex form, opens downward, vertex } (1,5) \Rightarrow \text{Range: } (-\infty, 5]
- id: mathematics-functions-and-graphs-1-03
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Find the x- and y-intercepts of } f(x) = x^{2}-5x+6.
  answer: |
    \begin{aligned}
    &\text{x-intercepts: } x^{2}-5x+6=0 \Rightarrow (x-2)(x-3)=0 \Rightarrow x=2,\ 3 \\
    &\text{y-intercept: } f(0)=6
    \end{aligned}
- id: mathematics-functions-and-graphs-1-04
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Determine whether } f(x) = x^{4}-3x^{2} \text{ is even, odd, or neither.}
  answer: |
    \begin{aligned}
    f(-x) &= (-x)^{4}-3(-x)^{2} = x^{4}-3x^{2} = f(x) \\
    &\Rightarrow f \text{ is even}
    \end{aligned}
- id: mathematics-functions-and-graphs-1-05
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Which of the following relations is NOT a function of } x? \\
    \text{(a) } y=x^{2}+1 \qquad \text{(b) } x=y^{2} \qquad \text{(c) } y=\sqrt{x} \qquad \text{(d) } y=|x|-2
  answer: |
    \text{(b), since } x=y^{2} \text{ gives } y=\pm\sqrt{x} \text{ — a vertical line at } x>0 \text{ meets the graph twice.}
- id: mathematics-functions-and-graphs-1-06
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Let } f(x)=2x+1 \text{ and } g(x)=x^{2}-3. \text{ Evaluate } (f\circ g)(2).
  answer: |
    \begin{aligned}
    g(2) &= 2^{2}-3 = 1 \\
    (f\circ g)(2) &= f(1) = 2(1)+1 = 3
    \end{aligned}
- id: mathematics-functions-and-graphs-2-01
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Find the inverse of } f(x) = \dfrac{2x+3}{x-1}.
  answer: |
    \begin{aligned}
    y &= \dfrac{2x+3}{x-1} \\
    y(x-1) &= 2x+3 \\
    xy-2x &= y+3 \\
    x(y-2) &= y+3 \\
    x &= \dfrac{y+3}{y-2} \\
    \Rightarrow f^{-1}(x) &= \dfrac{x+3}{x-2}
    \end{aligned}
- id: mathematics-functions-and-graphs-2-02
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Find the vertical asymptote(s) of } f(x) = \dfrac{1}{x^{2}-4}.
  answer: |
    \begin{aligned}
    &x^{2}-4=0 \Rightarrow x=\pm2 \\
    &\text{Numerator is nonzero at } x=\pm2 \Rightarrow \text{vertical asymptotes } x=2,\ x=-2
    \end{aligned}
- id: mathematics-functions-and-graphs-2-03
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Find the horizontal asymptote of } f(x) = \dfrac{3x^{2}+1}{x^{2}-4}.
  answer: |
    \begin{aligned}
    &\text{Degrees of numerator and denominator are equal (both 2)} \\
    &\Rightarrow \text{horizontal asymptote } y = \dfrac{3}{1} = 3
    \end{aligned}
- id: mathematics-functions-and-graphs-2-04
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Show that } f(x) = x^{3}+x \text{ is one-to-one on } \R.
  answer: |
    \begin{aligned}
    f'(x) &= 3x^{2}+1 > 0 \text{ for all } x \\
    &\Rightarrow f \text{ is strictly increasing} \Rightarrow f \text{ is one-to-one}
    \end{aligned}
- id: mathematics-functions-and-graphs-2-05
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Find the period of } f(x) = \sin(2x) + \cos(3x).
  answer: |
    \begin{aligned}
    &\text{Period of } \sin(2x): \dfrac{2\pi}{2}=\pi, \qquad \text{Period of } \cos(3x): \dfrac{2\pi}{3} \\
    &\text{Smallest common period: } T=2\pi \quad \left(2\pi = 2\cdot\pi = 3\cdot\tfrac{2\pi}{3}\right)
    \end{aligned}
- id: mathematics-functions-and-graphs-2-06
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Describe how the graph of } y=|x| \text{ is transformed to obtain } y=-2|x+3|-1.
  answer: |
    \text{Shift left 3} \quad\Rightarrow\quad \text{vertical stretch by factor 2} \quad\Rightarrow\quad \text{reflect over the x-axis} \quad\Rightarrow\quad \text{shift down 1}
- id: mathematics-functions-and-graphs-3-01
  category: Mathematics
  subtopic: Functions and Graphs
  level: 3
  question: |
    \text{Prove that a strictly monotonic function } f:\R\to\R \text{ is injective.}
  answer: |
    \begin{aligned}
    &\text{WLOG let } f \text{ be strictly increasing. Suppose } f(a)=f(b) \text{ with } a\neq b. \\
    &\text{WLOG } a<b. \text{ Strict increase gives } f(a)<f(b), \text{ contradicting } f(a)=f(b). \\
    &\text{So } a=b, \text{ i.e. } f \text{ is injective. (Strictly decreasing case is symmetric.)}
    \end{aligned}
- id: mathematics-functions-and-graphs-3-02
  category: Mathematics
  subtopic: Functions and Graphs
  level: 3
  question: |
    \text{Prove that if } f \text{ and } g \text{ are injective, then } f\circ g \text{ is injective.}
  answer: |
    \begin{aligned}
    \text{Suppose } (f\circ g)(a) &= (f\circ g)(b) \\
    f(g(a)) &= f(g(b)) \\
    \Rightarrow g(a) &= g(b) \quad (f \text{ injective}) \\
    \Rightarrow a &= b \quad (g \text{ injective})
    \end{aligned}
- id: mathematics-functions-and-graphs-3-03
  category: Mathematics
  subtopic: Functions and Graphs
  level: 3
  question: |
    \text{Find the oblique (slant) asymptote of } f(x) = \dfrac{x^{2}+2x+3}{x+1}.
  answer: |
    \begin{aligned}
    \dfrac{x^{2}+2x+3}{x+1} &= (x+1) + \dfrac{2}{x+1} \quad \text{(polynomial division)} \\
    &\text{As } x\to\pm\infty,\ \dfrac{2}{x+1}\to 0 \\
    &\Rightarrow \text{oblique asymptote: } y = x+1
    \end{aligned}
- id: mathematics-functions-and-graphs-3-04
  category: Mathematics
  subtopic: Functions and Graphs
  level: 3
  question: |
    \text{Classify the discontinuity at the indicated point for each:} \\
    \text{(a) } f(x)=\dfrac{x^{2}-4}{x-2} \text{ at } x=2 \qquad
    \text{(b) } g(x)=\dfrac{1}{x-2} \text{ at } x=2 \\
    \text{(c) } h(x)=\begin{cases} x & x<1 \\ x+2 & x\ge1 \end{cases} \text{ at } x=1
  answer: |
    \begin{aligned}
    &\text{(a) } f(x)=\dfrac{(x-2)(x+2)}{x-2}=x+2 \text{ for } x\neq2,\ \lim_{x\to2}f(x)=4 \text{ exists but } f(2) \text{ undefined} \Rightarrow \text{removable} \\
    &\text{(b) } \lim_{x\to2^{\pm}}\dfrac{1}{x-2}=\pm\infty \Rightarrow \text{infinite discontinuity} \\
    &\text{(c) } \lim_{x\to1^{-}}h(x)=1,\ \lim_{x\to1^{+}}h(x)=3,\ \text{both finite but unequal} \Rightarrow \text{jump discontinuity}
    \end{aligned}
- id: mathematics-functions-and-graphs-4-01
  category: Mathematics
  subtopic: Functions and Graphs
  level: 4
  question: |
    \text{A function } f:\R\to\R \text{ satisfies } f(x+y)=f(x)f(y) \text{ for all real } x,y, \text{ and } f(1)=2. \\
    \text{Find } f(0) \text{ and } f(n) \text{ for every integer } n.
  answer: |
    \begin{aligned}
    &\text{Set } x=y=0: f(0)=f(0)^{2} \Rightarrow f(0)=0 \text{ or } 1 \\
    &\text{If } f(0)=0, \text{ then } f(x)=f(x)f(0)=0\ \forall x, \text{ contradicting } f(1)=2 \Rightarrow f(0)=1 \\
    &\text{For } n\ge1: f(n)=f(\underbrace{1+\cdots+1}_{n})=f(1)^{n}=2^{n} \\
    &\text{Also } f(x)f(-x)=f(0)=1 \Rightarrow f(-n)=\dfrac{1}{f(n)}=2^{-n} \\
    &\Rightarrow f(n)=2^{n} \text{ for every integer } n
    \end{aligned}
- id: mathematics-functions-and-graphs-4-02
  category: Mathematics
  subtopic: Functions and Graphs
  level: 4
  question: |
    \text{A function } f \text{ defined on positive reals satisfies } f(xy)=f(x)+f(y) \text{ for all } x,y>0, \\
    \text{and } f(2)=1. \text{ Find } f(64).
  answer: |
    \begin{aligned}
    64 &= 2^{6} \\
    f(2^{k}) &= f(2\cdot2^{k-1}) = f(2)+f(2^{k-1}) \Rightarrow f(2^{k})=k\,f(2) \text{ by induction} \\
    f(64) &= f(2^{6}) = 6\cdot f(2) = 6
    \end{aligned}
- id: mathematics-functions-and-graphs-4-03
  category: Mathematics
  subtopic: Functions and Graphs
  level: 4
  question: |
    \text{Let } f(x)=x^{2}-2. \text{ Find all real solutions to } f(f(x))=x.
  answer: |
    \begin{aligned}
    &\text{Any fixed point of } f \text{ satisfies } f(f(x))=x, \text{ so } f(x)-x \text{ divides } f(f(x))-x: \\
    &f(f(x))-x = x^{4}-4x^{2}-x+2 = (x^{2}-x-2)(x^{2}+x-1) \\
    &x^{2}-x-2=0 \Rightarrow x=2,\,-1 \quad \text{(fixed points of } f\text{)} \\
    &x^{2}+x-1=0 \Rightarrow x=\dfrac{-1\pm\sqrt5}{2} \quad \text{(genuine period-2 points)} \\
    &\Rightarrow x \in \left\{2,\,-1,\,\dfrac{-1+\sqrt5}{2},\,\dfrac{-1-\sqrt5}{2}\right\}
    \end{aligned}
- id: mathematics-functions-and-graphs-4-04
  category: Mathematics
  subtopic: Functions and Graphs
  level: 4
  question: |
    \text{The graph below shows } y=f(x). \text{ Using the graph, determine:} \\
    \text{(a) the interval(s) where } f \text{ is strictly decreasing} \\
    \text{(b) } f(-3) \\
    \text{(c) whether } f \text{ is invertible on its full domain, and why} \\[1em]
    \includegraphics[width=8cm,height=6.4cm]{/static/graphs/mathematics-functions-and-graphs-4-04.png}
  answer: |
    \begin{aligned}
    &\text{(a) } f \text{ is strictly decreasing on } (-\infty, 0) \\
    &\text{(b) } f(-3) = |-3| = 3 \\
    &\text{(c) Not invertible: e.g. } f(-2)=2 \text{ and } f(x)=2 \text{ for every } x>2 \text{ too} \Rightarrow f \text{ is not one-to-one}
    \end{aligned}
- id: probability-statistics-combinatorics-1-01
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 1
  question: |
    \text{In how many ways can 6 different books be arranged in a row on a shelf?}
  answer: |
    6! = 720
- id: probability-statistics-combinatorics-1-02
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 1
  question: |
    \text{In how many ways can a president and a vice-president be chosen, in that order,} \\
    \text{from 8 candidates?}
  answer: |
    \dfrac{8!}{(8-2)!} = 8 \cdot 7 = 56
- id: probability-statistics-combinatorics-1-03
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 1
  question: |
    \text{In how many ways can a committee of 4 people be chosen from a group of 10?}
  answer: |
    \binom{10}{4} = \dfrac{10!}{4! \, 6!} = 210
- id: probability-statistics-combinatorics-1-04
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 1
  question: |
    \text{A menu offers 3 starters, 5 mains, and 2 desserts. How many different three-course} \\
    \text{meals (one of each) are possible?}
  answer: |
    3 \cdot 5 \cdot 2 = 30
- id: probability-statistics-combinatorics-1-05
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 1
  question: |
    \text{How many distinct arrangements are there of the letters in the word MISSISSIPPI?}
  answer: |
    \text{11 letters: M}{=}1,\ \text{I}{=}4,\ \text{S}{=}4,\ \text{P}{=}2 \\
    \dfrac{11!}{1! \, 4! \, 4! \, 2!} = 34650
- id: probability-statistics-combinatorics-2-01
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 2
  question: |
    \text{In how many distinct ways can 6 people be seated around a circular table, where} \\
    \text{rotations of a seating are considered the same?}
  answer: |
    \text{Fix one person to remove rotational symmetry, arrange the rest:} \\
    (6-1)! = 5! = 120
- id: probability-statistics-combinatorics-2-02
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 2
  question: |
    \text{In how many ways can 10 identical candies be distributed among 4 distinct children,} \\
    \text{where some children may receive none?}
  answer: |
    \text{Stars and bars with } n=10 \text{ items, } k=4 \text{ boxes:} \\
    \binom{n+k-1}{k-1} = \binom{13}{3} = 286
- id: probability-statistics-combinatorics-2-03
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 2
  question: |
    \text{A 4-character password is formed from the 26 letters of the alphabet, with repetition} \\
    \text{allowed. How many distinct passwords are possible?}
  answer: |
    \text{Each of the 4 positions is filled independently from 26 choices:} \\
    26^{4} = 456976
- id: probability-statistics-combinatorics-2-04
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 2
  question: |
    \text{A committee of 5 people is chosen from a group of 12 that includes a specific person,} \\
    \text{Alice. How many such committees include Alice?}
  answer: |
    \text{Alice's seat is fixed, so choose the remaining 4 members from the other 11:} \\
    \binom{11}{4} = 330
- id: probability-statistics-combinatorics-2-05
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 2
  question: |
    \text{A committee of 5 people is chosen from a group of 8 men and 4 women. How many} \\
    \text{committees include at least one woman?}
  answer: |
    \text{Total committees minus committees with no woman:} \\
    \binom{12}{5} - \binom{8}{5} = 792 - 56 = 736
- id: probability-statistics-combinatorics-3-01
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 3
  question: |
    \text{5 boys and 3 girls are to be arranged in a row such that no two girls sit next to} \\
    \text{each other. In how many ways can this be done?}
  answer: |
    \begin{aligned}
    &\text{Arrange the 5 boys first: } 5! \text{ ways.} \\
    &\text{This creates 6 gaps (including the two ends) around the boys.} \\
    &\text{Place the 3 girls into 3 of these 6 gaps, in order: } P(6,3) = 6 \cdot 5 \cdot 4 = 120 \\
    &\text{Total: } 5! \cdot 120 = 120 \cdot 120 = 14400
    \end{aligned}
- id: probability-statistics-combinatorics-3-02
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 3
  question: |
    \text{How many integers from 1 to 100 are divisible by 3 or by 5?}
  answer: |
    \begin{aligned}
    &A = \{\text{divisible by 3}\}, \ B = \{\text{divisible by 5}\} \\
    &|A| = \left\lfloor \dfrac{100}{3} \right\rfloor = 33, \quad |B| = \left\lfloor \dfrac{100}{5} \right\rfloor = 20 \\
    &|A \cap B| = \left\lfloor \dfrac{100}{15} \right\rfloor = 6 \\
    &|A \cup B| = |A| + |B| - |A \cap B| = 33 + 20 - 6 = 47
    \end{aligned}
- id: probability-statistics-combinatorics-3-03
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 3
  question: |
    \text{In how many ways can 5 distinct letters be placed into 5 addressed envelopes (one} \\
    \text{letter per envelope) such that no letter ends up in its correct envelope?}
  answer: |
    \begin{aligned}
    &\text{This counts derangements } D_n \text{ of } n=5 \text{ items:} \\
    &D_n = n! \sum_{k=0}^{n} \dfrac{(-1)^{k}}{k!} \\
    &D_5 = 120 \left(1 - 1 + \dfrac12 - \dfrac16 + \dfrac1{24} - \dfrac1{120}\right) = 120 \cdot \dfrac{11}{30} = 44
    \end{aligned}
- id: probability-statistics-combinatorics-3-04
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 3
  question: |
    \text{A group of 9 distinct students is divided into three project teams of sizes 4, 3,} \\
    \text{and 2. In how many ways can this be done?}
  answer: |
    \text{Multinomial coefficient for groups of sizes 4, 3, 2:} \\
    \dfrac{9!}{4! \, 3! \, 2!} = \dfrac{362880}{24 \cdot 6 \cdot 2} = 1260
- id: probability-statistics-combinatorics-3-05
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 3
  question: |
    \text{In how many ways can 10 identical candies be distributed among 4 distinct children} \\
    \text{so that each child receives at least one candy?}
  answer: |
    \begin{aligned}
    &\text{Give each child one candy first, then distribute the remaining } 10-4=6 \\
    &\text{candies freely among the 4 children (stars and bars, no restriction):} \\
    &\binom{6+4-1}{4-1} = \binom{9}{3} = 84
    \end{aligned}
- id: probability-statistics-combinatorics-4-01
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 4
  question: |
    \text{How many integers from 1 to 200 are divisible by 2, 3, or 5?}
  answer: |
    \begin{aligned}
    &A,B,C = \{\text{divisible by } 2,3,5\} \\
    &|A|=100, \ |B|=66, \ |C|=40 \\
    &|A \cap B|=33 \ (\div 6), \quad |A \cap C|=20 \ (\div 10), \quad |B \cap C|=13 \ (\div 15) \\
    &|A \cap B \cap C| = 6 \ (\div 30) \\
    &|A \cup B \cup C| = 100+66+40-33-20-13+6 = 146
    \end{aligned}
- id: probability-statistics-combinatorics-4-02
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 4
  question: |
    \text{4 married couples (8 people total) are to be seated in a row such that each couple} \\
    \text{sits together. In how many ways can this be done?}
  answer: |
    \begin{aligned}
    &\text{Treat each couple as one block: 4 blocks can be arranged in } 4! \text{ ways.} \\
    &\text{Within each block, the two people can swap order: } 2! \text{ ways per couple, } 2^{4} \text{ total.} \\
    &\text{Total: } 4! \cdot 2^{4} = 24 \cdot 16 = 384
    \end{aligned}
- id: probability-statistics-combinatorics-4-03
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 4
  question: |
    \text{Give a combinatorial (bijective) proof of the hockey-stick identity:} \\
    \sum_{i=r}^{n} \binom{i}{r} = \binom{n+1}{r+1}
  answer: |
    \begin{aligned}
    &\text{The right side counts the } (r{+}1)\text{-element subsets of } \{1,\dots,n+1\}. \\
    &\text{Classify each such subset by its largest element, } i+1, \text{ where } i \text{ ranges from } r \text{ to } n \\
    &\text{(the largest element must be at least } r+1 \text{ to leave room for } r \text{ smaller ones).} \\
    &\text{The remaining } r \text{ elements are then chosen from } \{1,\dots,i\}: \ \binom{i}{r} \text{ ways.} \\
    &\text{Summing over all valid largest elements counts every subset exactly once:} \\
    &\sum_{i=r}^{n} \binom{i}{r} = \binom{n+1}{r+1}
    \end{aligned}
- id: probability-statistics-combinatorics-4-04
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 4
  question: |
    \text{In how many ways can 6 distinct letters be placed into 6 addressed envelopes such} \\
    \text{that exactly 2 letters end up in their correct envelope?}
  answer: |
    \begin{aligned}
    &\text{Choose which 2 letters are correctly placed: } \binom{6}{2} = 15 \\
    &\text{The remaining 4 letters must all be in the wrong envelope: } D_4 = 9 \\
    &\text{Total: } 15 \cdot 9 = 135
    \end{aligned}
- id: probability-statistics-mean-median-mode-and-range-1-01
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 1
  question: |
    \text{Find the mean of the dataset: } 4, 8, 6, 5, 3
  answer: |
    \bar{x} = \dfrac{4+8+6+5+3}{5} = \dfrac{26}{5} = 5.2
- id: probability-statistics-mean-median-mode-and-range-1-02
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 1
  question: |
    \text{Find the median of the dataset: } 7, 2, 9, 4, 5
  answer: |
    \text{Sorted: } 2, 4, 5, 7, 9 \quad\Rightarrow\quad \text{median} = 5
- id: probability-statistics-mean-median-mode-and-range-1-03
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 1
  question: |
    \text{Find the median of the dataset: } 3, 7, 1, 9
  answer: |
    \text{Sorted: } 1, 3, 7, 9 \quad\Rightarrow\quad \text{median} = \dfrac{3+7}{2} = 5
- id: probability-statistics-mean-median-mode-and-range-1-04
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 1
  question: |
    \text{Find the mode of the dataset: } 2, 3, 3, 5, 7, 3, 8
  answer: |
    3 \text{ appears three times, more than any other value} \quad\Rightarrow\quad \text{mode} = 3
- id: probability-statistics-mean-median-mode-and-range-1-05
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 1
  question: |
    \text{Find the range of the dataset: } 12, 7, 19, 3, 15
  answer: |
    \text{range} = \max - \min = 19 - 3 = 16
- id: probability-statistics-mean-median-mode-and-range-1-06
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 1
  question: |
    \text{Find the mode(s) of the dataset: } 1, 2, 2, 3, 4, 4, 5
  answer: |
    \text{Both } 2 \text{ and } 4 \text{ occur twice, more than any other value} \quad\Rightarrow\quad \text{the dataset is bimodal with modes } 2 \text{ and } 4
- id: probability-statistics-mean-median-mode-and-range-2-01
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 2
  question: |
    \text{A dataset has mean } \bar{x}, \text{ median } m, \text{ mode } M, \text{ and range } R. \text{ If a constant } c \\
    \text{ is added to every value, what are the new mean, median, mode, and range?}
  answer: |
    \begin{aligned}
    \text{new mean} &= \bar{x} + c \\
    \text{new median} &= m + c \\
    \text{new mode} &= M + c \\
    \text{new range} &= R \quad \text{(unchanged: both the max and min shift by } c\text{, so their difference doesn't)}
    \end{aligned}
- id: probability-statistics-mean-median-mode-and-range-2-02
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 2
  question: |
    \text{A dataset has mean } \bar{x}, \text{ median } m, \text{ mode } M, \text{ and range } R. \text{ If every value is} \\
    \text{multiplied by a constant } k>0, \text{ what are the new mean, median, mode, and range?}
  answer: |
    \begin{aligned}
    \text{new mean} &= k\bar{x} \\
    \text{new median} &= km \\
    \text{new mode} &= kM \\
    \text{new range} &= kR
    \end{aligned}
- id: probability-statistics-mean-median-mode-and-range-2-03
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 2
  question: |
    \text{The dataset } 2, 3, 4, 5, 6 \text{ has mean } 4 \text{ and median } 4. \text{ Suppose the value } 6 \text{ is replaced} \\
    \text{by } 100. \text{ Find the new mean and median, and state which measure is more robust to outliers.}
  answer: |
    \begin{aligned}
    \text{new dataset: } &2, 3, 4, 5, 100 \\
    \text{new mean} &= \dfrac{2+3+4+5+100}{5} = \dfrac{114}{5} = 22.8 \\
    \text{new median (sorted } 2,3,4,5,100\text{)} &= 4
    \end{aligned} \\
    \text{The mean jumped from 4 to 22.8 while the median barely changed, so the median is far more robust to outliers.}
- id: probability-statistics-mean-median-mode-and-range-2-04
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 2
  question: |
    \text{A student's grades are } 80 \text{ (weight 2)}, 90 \text{ (weight 3)}, \text{ and } 70 \text{ (weight 1)}. \\
    \text{Find the weighted mean.}
  answer: |
    \bar{x}_w = \dfrac{2(80) + 3(90) + 1(70)}{2+3+1} = \dfrac{160+270+70}{6} = \dfrac{500}{6} \approx 83.33
- id: probability-statistics-mean-median-mode-and-range-2-05
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 2
  question: |
    \text{Group A has } 10 \text{ values with mean } 50. \text{ Group B has } 15 \text{ values with mean } 60. \\
    \text{Find the mean of the combined } 25 \text{ values.}
  answer: |
    \bar{x} = \dfrac{10(50) + 15(60)}{10+15} = \dfrac{500+900}{25} = \dfrac{1400}{25} = 56
- id: probability-statistics-mean-median-mode-and-range-3-01
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 3
  question: |
    \text{Prove that the sample mean } \bar{x} \text{ minimizes } f(c) = \sum_{i=1}^{n}(x_i - c)^2 \text{ over all real } c.
  answer: |
    \begin{aligned}
    f(c) &= \sum_{i=1}^n (x_i-c)^2 \\
    f'(c) &= -2\sum_{i=1}^n (x_i - c) \\
    \text{Setting } f'(c)=0: \quad \sum_{i=1}^n x_i - nc &= 0 \\
    c &= \dfrac{1}{n}\sum_{i=1}^n x_i = \bar{x} \\
    f''(c) &= 2n > 0
    \end{aligned} \\
    \text{so } f \text{ is convex and } c = \bar{x} \text{ is the unique minimizer.}
- id: probability-statistics-mean-median-mode-and-range-3-02
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 3
  question: |
    \text{Prove that the sample median } m \text{ minimizes } g(c) = \sum_{i=1}^{n}|x_i - c| \text{ over all real } c.
  answer: |
    \text{For } c \text{ strictly between the } k\text{-th and } (k{+}1)\text{-th order statistics (exactly } k \text{ points} \\
    \text{below } c\text{), each of those } k \text{ points contributes slope } +1 \text{ to } g \text{ (since } |x_i-c|=c-x_i\text{)} \\
    \text{and each of the remaining } n-k \text{ points contributes slope } -1\text{, so} \\
    \begin{aligned}
    g'(c) &= k - (n-k) = 2k-n, \quad \text{constant between consecutive data points.}
    \end{aligned} \\
    \text{This slope increases by 2 each time } c \text{ passes a data point, so } g \text{ is convex and piecewise linear.} \\
    \text{The slope is negative while } k < n/2 \text{ and positive once } k > n/2\text{, so the minimum is at } k=n/2\text{:} \\
    \text{if } n \text{ is odd this pins down the single middle order statistic; if } n \text{ is even, the slope is} \\
    \text{exactly } 0 \text{ for any } c \text{ between the two middle order statistics. In both cases this is the median } m.
- id: probability-statistics-mean-median-mode-and-range-3-03
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 3
  question: |
    \text{Group 1 has } n_1 \text{ values with mean } \bar{x}_1 \text{ and Group 2 has } n_2 \text{ values with mean } \bar{x}_2. \\
    \text{Derive a formula for the mean } \bar{x} \text{ of the combined } n_1+n_2 \text{ values, and show it is a} \\
    \text{weighted average of } \bar{x}_1 \text{ and } \bar{x}_2.
  answer: |
    \begin{aligned}
    \sum_{i=1}^{n_1} x_i &= n_1 \bar{x}_1, \qquad \sum_{j=1}^{n_2} y_j = n_2 \bar{x}_2 \\
    \bar{x} &= \frac{1}{n_1+n_2}\left(\sum_{i=1}^{n_1} x_i + \sum_{j=1}^{n_2} y_j\right) = \frac{n_1\bar{x}_1 + n_2\bar{x}_2}{n_1+n_2} \\
    &= \frac{n_1}{n_1+n_2}\bar{x}_1 + \frac{n_2}{n_1+n_2}\bar{x}_2
    \end{aligned} \\
    \text{The two weights } \frac{n_1}{n_1+n_2} \text{ and } \frac{n_2}{n_1+n_2} \text{ are nonnegative and sum to 1, so } \bar{x} \\
    \text{is a weighted average of } \bar{x}_1 \text{ and } \bar{x}_2, \text{ weighted by each group's size.}
- id: probability-statistics-mean-median-mode-and-range-3-04
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 3
  question: |
    \text{Let } X \sim \text{Exponential}(\lambda). \text{ Find } \E[X] \text{ and the median of } X, \text{ and determine} \\
    \text{which is larger.}
  answer: |
    \begin{aligned}
    \E[X] &= \frac{1}{\lambda} \\
    \text{Median } m \text{ solves } F(m) = 1 - e^{-\lambda m} &= \frac{1}{2} \\
    e^{-\lambda m} = \frac{1}{2} \quad\Rightarrow\quad m &= \frac{\ln 2}{\lambda} \approx \frac{0.693}{\lambda}
    \end{aligned} \\
    \text{Since } \frac{\ln 2}{\lambda} < \frac{1}{\lambda}\text{, the median is smaller than the mean, consistent with the} \\
    \text{exponential distribution's right skew pulling the mean above the median.}
- id: probability-statistics-mean-median-mode-and-range-4-01
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 4
  question: |
    \text{The mean of 7 numbers is } 15. \text{ Six of the numbers are } 10, 12, 18, 20, 9, 14. \text{ Find the} \\
    \text{seventh number.}
  answer: |
    \begin{aligned}
    \text{Total sum} &= 7 \times 15 = 105 \\
    \text{Sum of six known values} &= 10+12+18+20+9+14 = 83 \\
    \text{Seventh value} &= 105 - 83 = 22
    \end{aligned}
- id: probability-statistics-mean-median-mode-and-range-4-02
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 4
  question: |
    \text{A class of } 20 \text{ students has an average test score of } 68. \text{ A new student joins and} \\
    \text{scores } 95. \text{ Find the new average for all } 21 \text{ students.}
  answer: |
    \begin{aligned}
    \text{Original total} &= 20 \times 68 = 1360 \\
    \text{New total} &= 1360 + 95 = 1455 \\
    \text{New average} &= \frac{1455}{21} = \frac{485}{7} \approx 69.29
    \end{aligned}
- id: probability-statistics-mean-median-mode-and-range-4-03
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 4
  question: |
    \text{A company has } 10 \text{ employees. Nine of them each earn } \$55{,}000\text{, and the mean salary} \\
    \text{across all } 10 \text{ employees is } \$80{,}000. \text{ Find the CEO's salary (the tenth employee), and} \\
    \text{compare it to the median salary.}
  answer: |
    \begin{aligned}
    \text{Total payroll} &= 10 \times 80{,}000 = 800{,}000 \\
    \text{Sum of the nine } \$55{,}000 \text{ salaries} &= 9 \times 55{,}000 = 495{,}000 \\
    \text{CEO salary} &= 800{,}000 - 495{,}000 = 305{,}000
    \end{aligned} \\
    \text{The median salary is } \$55{,}000 \text{ (the middle value among the ten, sorted), far below the} \\
    \$80{,}000 \text{ mean — a single large value pulls the mean well above the median.}
- id: probability-statistics-mean-median-mode-and-range-4-04
  category: Probability & Statistics
  subtopic: Mean, Median, Mode and Range
  level: 4
  question: |
    \text{A market-making desk's P\&L over } 11 \text{ trading days consists of } 10 \text{ days each losing exactly} \\
    \$2{,}000\text{, and one day with a large gain. The mean P\&L over all } 11 \text{ days is } \$1{,}000. \text{ Find the} \\
    \text{gain on the big day, and find the median P\&L.}
  answer: |
    \begin{aligned}
    \text{Total P\&L} &= 11 \times 1{,}000 = 11{,}000 \\
    \text{Sum of the } 10 \text{ losing days} &= 10 \times (-2{,}000) = -20{,}000 \\
    \text{Big-gain day} &= 11{,}000 - (-20{,}000) = 31{,}000
    \end{aligned} \\
    \text{Sorted P\&L: ten values of } -2{,}000 \text{ followed by } 31{,}000\text{, so the median (6th of 11 values) is} \\
    -2{,}000\text{ — negative, even though the mean P\&L is a positive } \$1{,}000\text{, because one large gain} \\
    \text{pulls the mean up without affecting the median.}
- id: probability-statistics-conditional-probability-and-bayes-1-01
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 1
  question: |
    \text{Given } \P(A \cap B) = 0.3 \text{ and } \P(B) = 0.5, \text{ find } \P(A \mid B).
  answer: |
    \P(A\mid B) = \dfrac{\P(A\cap B)}{\P(B)} = \dfrac{0.3}{0.5} = 0.6
- id: probability-statistics-conditional-probability-and-bayes-1-02
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 1
  question: |
    \text{A survey of 200 people classifies them by smoking status and whether they have a} \\
    \text{certain condition:} \\
    \begin{array}{c|cc}
     & \text{Condition} & \text{No condition} \\\hline
    \text{Smoker} & 30 & 70 \\
    \text{Non-smoker} & 20 & 80
    \end{array} \\
    \text{Find } \P(\text{Condition} \mid \text{Smoker}).
  answer: |
    \text{Total smokers} = 30+70 = 100 \\
    \P(\text{Condition}\mid\text{Smoker}) = \dfrac{30}{100} = 0.3
- id: probability-statistics-conditional-probability-and-bayes-1-03
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 1
  question: |
    \text{Events } A \text{ and } B \text{ satisfy } \P(A) = 0.4 \text{ and } \P(A \mid B) = 0.4. \\
    \text{Are } A \text{ and } B \text{ independent? Justify your answer.}
  answer: |
    \text{Yes. } \P(A\mid B) = \P(A) \text{ is exactly the definition of independence between } A \text{ and } B\text{:} \\
    \text{knowing that } B \text{ occurred does not change the probability of } A.
- id: probability-statistics-conditional-probability-and-bayes-1-04
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 1
  question: |
    \text{Given } \P(A) = 0.6 \text{ and } \P(B \mid A) = 0.5, \text{ find } \P(A \cap B).
  answer: |
    \P(A\cap B) = \P(B\mid A)\,\P(A) = 0.5 \times 0.6 = 0.3
- id: probability-statistics-conditional-probability-and-bayes-1-05
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 1
  question: |
    \text{Factory 1 produces 60\% of a company's widgets, with a 2\% defect rate. Factory 2} \\
    \text{produces the remaining 40\%, with a 5\% defect rate. Find the overall probability that} \\
    \text{a randomly chosen widget is defective.}
  answer: |
    \P(D) = \P(D\mid F_1)\P(F_1) + \P(D\mid F_2)\P(F_2) = (0.02)(0.6) + (0.05)(0.4) = 0.012 + 0.02 = 0.032
- id: probability-statistics-conditional-probability-and-bayes-1-06
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 1
  question: |
    \text{A bag contains one fair coin and one two-headed coin. A coin is picked at random and} \\
    \text{flipped once, landing heads. Find the probability the coin picked was the fair one.}
  answer: |
    \begin{aligned}
    \P(\text{Fair}) &= \P(\text{Two-headed}) = 0.5 \\
    \P(H\mid \text{Fair}) &= 0.5, \quad \P(H\mid\text{Two-headed}) = 1 \\
    \P(H) &= 0.5(0.5) + 0.5(1) = 0.75 \\
    \P(\text{Fair}\mid H) &= \dfrac{\P(H\mid\text{Fair})\,\P(\text{Fair})}{\P(H)} = \dfrac{0.5 \times 0.5}{0.75} = \dfrac{1}{3}
    \end{aligned}
- id: probability-statistics-conditional-probability-and-bayes-2-01
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 2
  question: |
    \text{Three machines A, B, C produce 20\%, 30\%, and 50\% of a factory's items respectively,} \\
    \text{with defect rates 1\%, 2\%, and 3\%. Given that a randomly selected item is defective,} \\
    \text{find the probability it came from machine A.}
  answer: |
    \begin{aligned}
    \P(D) &= (0.01)(0.2) + (0.02)(0.3) + (0.03)(0.5) = 0.002+0.006+0.015 = 0.023 \\
    \P(A\mid D) &= \dfrac{\P(D\mid A)\,\P(A)}{\P(D)} = \dfrac{0.002}{0.023} = \dfrac{2}{23} \approx 0.087
    \end{aligned}
- id: probability-statistics-conditional-probability-and-bayes-2-02
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 2
  question: |
    \text{An urn contains 5 red and 3 blue balls. Three balls are drawn without replacement.} \\
    \text{Find the probability the sequence drawn is red, red, blue (in that order).}
  answer: |
    \P(R,R,B) = \dfrac{5}{8}\cdot\dfrac{4}{7}\cdot\dfrac{3}{6} = \dfrac{60}{336} = \dfrac{5}{28}
- id: probability-statistics-conditional-probability-and-bayes-2-03
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 2
  question: |
    \text{A weighted die shows a "high" roll (4, 5, 6) with probability 0.6 and a "low" roll} \\
    \text{(1, 2, 3) with probability 0.4. After a high roll, a coin that lands heads with} \\
    \text{probability 0.7 is flipped; after a low roll, a coin that lands heads with probability} \\
    \text{0.3 is flipped. Given the coin lands heads, find the probability the roll was high.}
  answer: |
    \begin{aligned}
    \P(H) &= (0.7)(0.6) + (0.3)(0.4) = 0.42+0.12 = 0.54 \\
    \P(\text{High}\mid H) &= \dfrac{(0.7)(0.6)}{0.54} = \dfrac{0.42}{0.54} = \dfrac{7}{9} \approx 0.778
    \end{aligned}
- id: probability-statistics-conditional-probability-and-bayes-2-04
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 2
  question: |
    \text{Events } A \text{ and } B \text{ have joint probabilities } \P(A\cap B)=0.2, \ \P(A\cap B^c)=0.3, \\
    \P(A^c\cap B)=0.1, \ \P(A^c\cap B^c)=0.4. \text{ Find } \P(A \mid B^c).
  answer: |
    \P(B^c) = \P(A\cap B^c)+\P(A^c\cap B^c) = 0.3+0.4=0.7 \\
    \P(A\mid B^c) = \dfrac{\P(A\cap B^c)}{\P(B^c)} = \dfrac{0.3}{0.7} = \dfrac{3}{7}
- id: probability-statistics-conditional-probability-and-bayes-2-05
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 2
  question: |
    \text{A disease has prevalence 2\% in a population. A test for the disease has sensitivity} \\
    \text{95\% (true positive rate) and specificity 90\% (true negative rate). Find the positive} \\
    \text{predictive value (PPV) and negative predictive value (NPV) of the test.}
  answer: |
    \begin{aligned}
    \P(D) &= 0.02, \quad \P(D^c)=0.98 \\
    \P(+) &= \P(+\mid D)\P(D) + \P(+\mid D^c)\P(D^c) = (0.95)(0.02)+(0.10)(0.98) = 0.019+0.098=0.117 \\
    \text{PPV} = \P(D\mid +) &= \dfrac{0.019}{0.117} \approx 0.162 \\
    \P(-) &= 1-0.117 = 0.883 \\
    \text{NPV} = \P(D^c\mid -) &= \dfrac{\P(-\mid D^c)\P(D^c)}{\P(-)} = \dfrac{(0.90)(0.98)}{0.883} = \dfrac{0.882}{0.883} \approx 0.999
    \end{aligned}
- id: probability-statistics-conditional-probability-and-bayes-3-01
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 3
  question: |
    \text{Let } B_1,\dots,B_n \text{ be a partition of the sample space (pairwise disjoint, union} \\
    \text{equal to everything), each with } \P(B_i)>0, \text{ and let } A \text{ be an event with } \P(A)>0. \\
    \text{Derive Bayes' theorem for } \P(B_k \mid A) \text{ in terms of } \P(A\mid B_i) \text{ and } \P(B_i).
  answer: |
    \begin{aligned}
    \text{By definition of conditional probability:} \quad \P(B_k \mid A) &= \dfrac{\P(A\cap B_k)}{\P(A)} \\
    \text{By the multiplication rule:} \quad \P(A\cap B_k) &= \P(A\mid B_k)\,\P(B_k)
    \end{aligned} \\
    \text{Since } B_1,\dots,B_n \text{ partition the sample space, the law of total probability gives} \\
    \P(A) = \sum_{i=1}^{n} \P(A\mid B_i)\,\P(B_i). \text{ Substituting both into the first line yields} \\
    \P(B_k\mid A) = \dfrac{\P(A\mid B_k)\,\P(B_k)}{\displaystyle\sum_{i=1}^{n}\P(A\mid B_i)\,\P(B_i)}
- id: probability-statistics-conditional-probability-and-bayes-3-02
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 3
  question: |
    \text{Prove that if events } A \text{ and } B \text{ are independent, then } A \text{ and } B^c \text{ are also independent.}
  answer: |
    \begin{aligned}
    \P(A\cap B^c) &= \P(A) - \P(A\cap B) \qquad \text{(since } A = (A\cap B)\cup(A\cap B^c) \text{ is a disjoint union)} \\
    &= \P(A) - \P(A)\P(B) \qquad \text{(by independence of } A,B\text{)} \\
    &= \P(A)\big(1-\P(B)\big) \\
    &= \P(A)\,\P(B^c)
    \end{aligned} \\
    \text{Since } \P(A\cap B^c) = \P(A)\,\P(B^c)\text{, } A \text{ and } B^c \text{ are independent.}
- id: probability-statistics-conditional-probability-and-bayes-3-03
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 3
  question: |
    \text{Let } H \text{ be a hypothesis with prior } \P(H), \text{ and let } E_1, E_2 \text{ be two pieces of} \\
    \text{evidence that are conditionally independent given } H \text{ and given } H^c. \text{ Show that} \\
    \text{updating on } E_1 \text{ then } E_2 \text{ (one at a time) yields the same posterior } \P(H\mid E_1\cap E_2) \\
    \text{as updating on both at once.}
  answer: |
    \begin{aligned}
    \text{Step 1 (update on } E_1\text{):} \quad \P(H\mid E_1) &= \dfrac{\P(E_1\mid H)\,\P(H)}{\P(E_1\mid H)\,\P(H) + \P(E_1\mid H^c)\,\P(H^c)} \\[4pt]
    \text{Step 2, using } \P(H\mid E_1) \text{ as the new prior:} \quad \P(H\mid E_1, E_2) &= \dfrac{\P(E_2\mid H, E_1)\,\P(H\mid E_1)}{\P(E_2\mid H,E_1)\,\P(H\mid E_1) + \P(E_2\mid H^c,E_1)\,\P(H^c\mid E_1)}
    \end{aligned} \\
    \text{By conditional independence, } \P(E_2\mid H,E_1)=\P(E_2\mid H) \text{ and } \P(E_2\mid H^c,E_1)=\P(E_2\mid H^c)\text{,} \\
    \text{and substituting } \P(H\mid E_1) \text{ from step 1 (the normalizing denominators cancel) gives} \\
    \P(H\mid E_1,E_2) = \dfrac{\P(E_2\mid H)\,\P(E_1\mid H)\,\P(H)}{\P(E_2\mid H)\,\P(E_1\mid H)\,\P(H) + \P(E_2\mid H^c)\,\P(E_1\mid H^c)\,\P(H^c)} \\
    \text{which is exactly the direct joint-Bayes formula } \P(H\mid E_1\cap E_2) \text{ obtained by factoring} \\
    \P(E_1\cap E_2\mid H) = \P(E_1\mid H)\,\P(E_2\mid H) \text{ under conditional independence — so updating} \\
    \text{sequentially gives the identical posterior as updating jointly.}
- id: probability-statistics-conditional-probability-and-bayes-3-04
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 3
  question: |
    \text{For events } A,B \text{ with } \P(A),\P(B)>0, \text{ derive the relationship between } \P(A\mid B) \\
    \text{and } \P(B\mid A), \text{ and show they are equal if and only if } \P(A)=\P(B).
  answer: |
    \begin{aligned}
    \P(A\mid B) &= \dfrac{\P(A\cap B)}{\P(B)}, \qquad \P(B\mid A) = \dfrac{\P(A\cap B)}{\P(A)} \\
    \text{Dividing the two:} \quad \dfrac{\P(A\mid B)}{\P(B\mid A)} &= \dfrac{\P(A)}{\P(B)}
    \end{aligned} \\
    \text{So } \P(A\mid B) = \P(B\mid A)\cdot\dfrac{\P(A)}{\P(B)}\text{, and the two conditional probabilities} \\
    \text{coincide exactly when } \dfrac{\P(A)}{\P(B)}=1\text{, i.e. } \P(A)=\P(B)\text{. In general } \P(A\mid B)\neq\P(B\mid A) \\
    \text{whenever the two events have different marginal probabilities — the source of the} \\
    \text{"transposed conditional" fallacy (confusing } \P(\text{evidence}\mid\text{hypothesis}) \text{ with } \P(\text{hypothesis}\mid\text{evidence})\text{).}
- id: probability-statistics-conditional-probability-and-bayes-4-01
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 4
  question: |
    \text{In the Monty Hall problem: there are 3 doors, a car behind one and goats behind the} \\
    \text{other two. You pick a door at random. The host, who knows what's behind each door,} \\
    \text{opens one of the other two doors to reveal a goat, then offers you the chance to switch} \\
    \text{to the remaining unopened door. Find the probability of winning the car if you switch.}
  answer: |
    \begin{aligned}
    &\text{Say you pick door 1. Let } C_i \text{ be the event the car is behind door } i\text{, each with prior } \P(C_i)=\tfrac13. \\
    &\text{Let } H \text{ be the event the host opens door 3.} \\
    &\P(H\mid C_1) = \tfrac12 \ \text{(host picks randomly between doors 2, 3, both goats)} \\
    &\P(H\mid C_2) = 1 \ \text{(host is forced to open door 3, since door 2 has the car)} \\
    &\P(H\mid C_3) = 0 \ \text{(host never opens the door hiding the car)} \\
    &\P(H) = \tfrac12\cdot\tfrac13 + 1\cdot\tfrac13 + 0\cdot\tfrac13 = \tfrac12 \\
    &\P(C_1\mid H) = \dfrac{\tfrac12\cdot\tfrac13}{\tfrac12} = \tfrac13 \qquad \text{(stay: still the original pick)} \\
    &\P(C_2\mid H) = \dfrac{1\cdot\tfrac13}{\tfrac12} = \tfrac23 \qquad \text{(switch to door 2)}
    \end{aligned} \\
    \text{So switching wins the car with probability } \tfrac23\text{, double the probability of staying.}
- id: probability-statistics-conditional-probability-and-bayes-4-02
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 4
  question: |
    \text{Three prisoners, A, B, and C, are told one of them will be pardoned, each with} \\
    \text{probability } \tfrac13. \text{ Prisoner A asks the guard (who knows the outcome) to name one} \\
    \text{of the other two prisoners who will NOT be pardoned — if both B and C will not be} \\
    \text{pardoned, the guard picks which name to give uniformly at random. The guard says} \\
    \text{"B will not be pardoned." Find the probability that A is pardoned given this} \\
    \text{information, and show it has not changed from } \tfrac13.
  answer: |
    \begin{aligned}
    &\text{Let } P_A, P_B, P_C \text{ be the events each prisoner is pardoned, each with prior } \tfrac13. \\
    &\text{Let } N_B \text{ be the event the guard names B as not pardoned.} \\
    &\P(N_B\mid P_A) = \tfrac12 \ \text{(guard can truthfully name either B or C, picks uniformly)} \\
    &\P(N_B\mid P_B) = 0 \ \text{(guard cannot name the prisoner who is pardoned)} \\
    &\P(N_B\mid P_C) = 1 \ \text{(guard must name B, since C is pardoned and can't be named)} \\
    &\P(N_B) = \tfrac12\cdot\tfrac13 + 0\cdot\tfrac13 + 1\cdot\tfrac13 = \tfrac12 \\
    &\P(P_A\mid N_B) = \dfrac{\tfrac12\cdot\tfrac13}{\tfrac12} = \tfrac13
    \end{aligned} \\
    \text{A's chance of being pardoned is still } \tfrac13 \text{ — learning B's fate gave A no new information} \\
    \text{about A's own outcome; instead it is } \P(P_C\mid N_B)=\dfrac{1\cdot\tfrac13}{\tfrac12}=\tfrac23 \text{ that rises,} \\
    \text{mirroring the Monty Hall switch.}
- id: probability-statistics-conditional-probability-and-bayes-4-03
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 4
  question: |
    \text{A family has two children. (a) Given that at least one child is a boy, find the} \\
    \text{probability both children are boys. (b) Given that the older child is a boy, find the} \\
    \text{probability both children are boys. Assume each child is independently equally likely} \\
    \text{to be a boy or girl, and explain why the two answers differ.}
  answer: |
    \begin{aligned}
    &\text{Sample space (older, younger): } \{BB, BG, GB, GG\}\text{, each with probability } \tfrac14. \\
    &\text{(a)} \quad \P(BB \mid \text{at least one boy}) = \dfrac{\P(BB)}{\P(BB)+\P(BG)+\P(GB)} = \dfrac{1/4}{3/4} = \dfrac13 \\
    &\text{(b)} \quad \P(BB \mid \text{older is a boy}) = \dfrac{\P(BB)}{\P(BB)+\P(BG)} = \dfrac{1/4}{2/4} = \dfrac12
    \end{aligned} \\
    \text{The two conditioning events differ: "at least one boy" is consistent with 3 equally likely} \\
    \text{outcomes (} BB, BG, GB\text{), while "the older is a boy" is consistent with only 2 (} BB, BG\text{)} \\
    \text{— conditioning on the less specific event (a) leaves more room for the "mixed" outcomes,} \\
    \text{pulling the answer away from } \tfrac12.
- id: probability-statistics-conditional-probability-and-bayes-4-04
  category: Probability & Statistics
  subtopic: Conditional Probability and Bayes
  level: 4
  question: |
    \text{A factory's items come from Line A (70\% of production) or Line B (30\%). Each item} \\
    \text{independently passes an initial inspection with probability 0.9 if from Line A, and 0.75} \\
    \text{if from Line B; items that fail are scrapped before reaching final testing. Items that} \\
    \text{pass are found defective at final testing with probability 0.02 (Line A) or 0.06 (Line B).} \\
    \text{Given that an item was found defective at final testing, find the probability it came} \\
    \text{from Line B.} \\
    \includegraphics[width=8cm,height=6cm]{/static/graphs/probability-statistics-conditional-probability-and-bayes-4-04.png}
  answer: |
    \begin{aligned}
    \P(\text{Defective}, A) &= \P(A)\,\P(\text{Pass}\mid A)\,\P(\text{Defective}\mid \text{Pass}, A) = 0.7 \times 0.9 \times 0.02 = 0.0126 \\
    \P(\text{Defective}, B) &= \P(B)\,\P(\text{Pass}\mid B)\,\P(\text{Defective}\mid \text{Pass}, B) = 0.3 \times 0.75 \times 0.06 = 0.0135 \\
    \P(\text{Defective}) &= 0.0126 + 0.0135 = 0.0261 \\
    \P(B \mid \text{Defective}) &= \dfrac{0.0135}{0.0261} = \dfrac{15}{29} \approx 0.517
    \end{aligned}
- id: probability-statistics-set-theory-in-probability-1-01
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 1
  question: |
    \text{A fair six-sided die is rolled once. Let } \Omega \text{ be the sample space and let } A \text{ be} \\
    \text{the event "the roll is even." Write } \Omega \text{ and } A \text{ as sets.}
  answer: |
    \Omega = \{1,2,3,4,5,6\}, \qquad A = \{2,4,6\} \subseteq \Omega
- id: probability-statistics-set-theory-in-probability-1-02
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 1
  question: |
    \text{For events } A \text{ and } B \text{ in a sample space, state in words what each of the following} \\
    \text{represents: } A \cup B, \quad A \cap B, \quad A^c.
  answer: |
    \begin{aligned}
    A \cup B &: \text{"} A \text{ or } B \text{ occurs (or both)"} \\
    A \cap B &: \text{"both } A \text{ and } B \text{ occur"} \\
    A^c &: \text{"} A \text{ does not occur"}
    \end{aligned}
- id: probability-statistics-set-theory-in-probability-1-03
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 1
  question: |
    \text{Events } A \text{ and } B \text{ are mutually exclusive (disjoint). Write this condition using set} \\
    \text{notation, and explain what it means for } A \text{ and } B \text{ to occur simultaneously.}
  answer: |
    A \cap B = \emptyset \text{: } A \text{ and } B \text{ share no outcomes, so they cannot both occur on the} \\
    \text{same trial — observing } A \text{ rules out } B \text{ and vice versa.}
- id: probability-statistics-set-theory-in-probability-1-04
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 1
  question: |
    \text{A collection of events } A_1, A_2, \dots, A_n \text{ forms a partition of the sample space } \Omega. \\
    \text{State the two conditions this requires, and give an example partition for the roll of a} \\
    \text{single die.}
  answer: |
    \begin{aligned}
    &\text{(1) Pairwise disjoint: } A_i \cap A_j = \emptyset \text{ for all } i \neq j. \\
    &\text{(2) Exhaustive: } A_1 \cup A_2 \cup \dots \cup A_n = \Omega.
    \end{aligned} \\
    \text{Example: for a die roll, } A_1 = \{1,2,3\} \text{ and } A_2 = \{4,5,6\} \text{ partition } \Omega = \{1,\dots,6\}.
- id: probability-statistics-set-theory-in-probability-1-05
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 1
  question: |
    \text{State the inclusion-exclusion formula for } \P(A \cup B), \text{ then use it to find } \P(A \cup B) \\
    \text{given } \P(A) = 0.5, \ \P(B) = 0.4, \ \P(A \cap B) = 0.2.
  answer: |
    \P(A \cup B) = \P(A) + \P(B) - \P(A \cap B) = 0.5 + 0.4 - 0.2 = 0.7
- id: probability-statistics-set-theory-in-probability-2-01
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 2
  question: |
    \text{Given } \P(A)=0.5,\ \P(B)=0.4,\ \P(C)=0.3,\ \P(A\cap B)=0.2,\ \P(A\cap C)=0.15,\ \P(B\cap C)=0.1, \\
    \text{and } \P(A\cap B\cap C)=0.05, \text{ find } \P(A \cup B \cup C).
  answer: |
    \begin{aligned}
    \P(A\cup B\cup C) &= \P(A)+\P(B)+\P(C) - \P(A\cap B)-\P(A\cap C)-\P(B\cap C) + \P(A\cap B\cap C) \\
    &= 0.5+0.4+0.3 - 0.2-0.15-0.1 + 0.05 \\
    &= 0.8
    \end{aligned}
- id: probability-statistics-set-theory-in-probability-2-02
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 2
  question: |
    \text{A fair coin is flipped 4 times, independently. Let } A \text{ be the event "at least one flip} \\
    \text{comes up heads." Find } \P(A) \text{ using the complement.}
  answer: |
    \begin{aligned}
    A^c &= \text{"no heads in 4 flips"}, \qquad \P(A^c) = \left(\tfrac12\right)^4 = \tfrac{1}{16} \\
    \P(A) &= 1 - \P(A^c) = 1 - \tfrac{1}{16} = \tfrac{15}{16}
    \end{aligned}
- id: probability-statistics-set-theory-in-probability-2-03
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 2
  question: |
    \text{Let } A \text{ be the event "a randomly chosen card is the Ace of Spades" and } B \text{ be the event} \\
    \text{"the card is a spade," so } A \subseteq B. \text{ Without computing either probability directly,} \\
    \text{explain why } \P(A) \le \P(B) \text{ must hold, and confirm it numerically for a standard 52-card deck.}
  answer: |
    \text{Since } A \subseteq B, \text{ every outcome in } A \text{ is also in } B, \text{ so } B \text{ occurring is} \\
    \text{no less likely than } A \text{ occurring: monotonicity gives } \P(A) \le \P(B). \\
    \text{Numerically, } \P(A) = \tfrac{1}{52} \text{ and } \P(B) = \tfrac{13}{52} = \tfrac14, \text{ and indeed } \tfrac{1}{52} \le \tfrac14.
- id: probability-statistics-set-theory-in-probability-2-04
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 2
  question: |
    \text{Given } \P(A) = 0.6 \text{ and } \P(A \cap B) = 0.25, \text{ find } \P(A \setminus B), \text{ the probability} \\
    \text{that } A \text{ occurs but } B \text{ does not.}
  answer: |
    \P(A \setminus B) = \P(A) - \P(A \cap B) = 0.6 - 0.25 = 0.35
- id: probability-statistics-set-theory-in-probability-3-01
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 3
  question: |
    \text{Prove De Morgan's laws for events: } (A \cup B)^c = A^c \cap B^c \text{ and } (A \cap B)^c = A^c \cup B^c. \\
    \text{State the corresponding probability identity for the first law.}
  answer: |
    \begin{aligned}
    \omega \in (A\cup B)^c &\iff \omega \notin A \cup B \iff \omega \notin A \text{ and } \omega \notin B \iff \omega \in A^c \cap B^c, \\
    \omega \in (A\cap B)^c &\iff \omega \notin A \cap B \iff \omega \notin A \text{ or } \omega \notin B \iff \omega \in A^c \cup B^c.
    \end{aligned} \\
    \text{Both chains of "iff" hold at every step, so the two sets have the same elements:} \\
    (A\cup B)^c = A^c \cap B^c \text{ and } (A\cap B)^c = A^c \cup B^c. \\
    \text{Consequence of the first law: } \P((A\cup B)^c) = \P(A^c \cap B^c).
- id: probability-statistics-set-theory-in-probability-3-02
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 3
  question: |
    \text{Derive the general inclusion-exclusion formula for } n \text{ events } A_1, \dots, A_n, \text{ expressing} \\
    \P(A_1 \cup \dots \cup A_n) \text{ as an alternating sum over all nonempty subsets of } \{1,\dots,n\}.
  answer: |
    \text{Let } \mathbb{1}_A \text{ denote the indicator of event } A, \text{ so } \P(A) = \E[\mathbb{1}_A]. \text{ Since} \\
    \mathbb{1}_{A^c} = 1-\mathbb{1}_A, \text{ the indicator of the union satisfies} \\
    \mathbb{1}_{A_1\cup\dots\cup A_n} = 1 - \prod_{i=1}^n (1-\mathbb{1}_{A_i}). \\
    \text{Expanding the product by picking, for each factor, either the } 1 \text{ or the } -\mathbb{1}_{A_i} \text{ term gives} \\
    \text{one term per subset } S \subseteq \{1,\dots,n\}\text{:} \\
    \prod_{i=1}^n (1-\mathbb{1}_{A_i}) = \sum_{S \subseteq \{1,\dots,n\}} (-1)^{|S|} \mathbb{1}_{\bigcap_{i\in S} A_i}. \\
    \text{The } S=\emptyset \text{ term equals } 1\text{, so subtracting this sum from 1 leaves only nonempty } S\text{:} \\
    \mathbb{1}_{A_1\cup\dots\cup A_n} = \sum_{\emptyset \neq S \subseteq \{1,\dots,n\}} (-1)^{|S|+1} \mathbb{1}_{\bigcap_{i\in S} A_i}. \\
    \text{Taking expectations of both sides (linearity of } \E\text{) and grouping subsets by size } |S|=k \\
    \text{recovers the familiar form:} \\
    \P\!\left(\bigcup_{i=1}^n A_i\right) = \sum_{\emptyset\neq S} (-1)^{|S|+1}\P\!\left(\bigcap_{i\in S}A_i\right) = \sum_i \P(A_i) - \sum_{i<j}\P(A_i\cap A_j) + \dots + (-1)^{n+1}\P(A_1\cap\dots\cap A_n).
- id: probability-statistics-set-theory-in-probability-3-03
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 3
  question: |
    \text{Prove Boole's inequality (the union bound): for events } A_1, \dots, A_n, \\
    \P\!\left(\bigcup_{i=1}^n A_i\right) \le \sum_{i=1}^n \P(A_i).
  answer: |
    \text{Two-event case: since } \P(A\cap B) \ge 0\text{, inclusion-exclusion gives} \\
    \P(A\cup B) = \P(A)+\P(B)-\P(A\cap B) \le \P(A)+\P(B). \\
    \text{Induction on } n\text{: the base case } n=1 \text{ holds with equality. Assume} \\
    \P\!\left(\bigcup_{i=1}^n A_i\right) \le \sum_{i=1}^n \P(A_i) \text{ for some } n \ge 1, \text{ and let } B = \bigcup_{i=1}^n A_i. \\
    \text{Applying the two-event case to } B \text{ and } A_{n+1}\text{, then the induction hypothesis:} \\
    \begin{aligned}
    \P\!\left(\bigcup_{i=1}^{n+1} A_i\right) = \P(B \cup A_{n+1}) &\le \P(B) + \P(A_{n+1}) \\
    &\le \sum_{i=1}^n \P(A_i) + \P(A_{n+1}) = \sum_{i=1}^{n+1} \P(A_i).
    \end{aligned} \\
    \text{Hence the inequality holds for all } n \ge 1 \text{ by induction.}
- id: probability-statistics-set-theory-in-probability-3-04
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 3
  question: |
    \text{Using only finite additivity (} \P(C \cup D) = \P(C) + \P(D) \text{ for disjoint } C,D \text{), prove that} \\
    A \subseteq B \implies \P(A) \le \P(B).
  answer: |
    \text{Suppose } A \subseteq B. \text{ Write } B \text{ as the disjoint union } B = A \cup (B \setminus A), \text{ since every} \\
    \text{element of } B \text{ is either in } A \text{ or in } B \text{ but not } A\text{, and these two pieces share no} \\
    \text{elements (} A \cap (B\setminus A) = \emptyset \text{).} \\
    \text{Finite additivity then gives } \P(B) = \P(A) + \P(B\setminus A). \text{ Since } \P(B\setminus A) \ge 0 \\
    \text{(probabilities are nonnegative), } \P(B) = \P(A) + \P(B\setminus A) \ge \P(A)\text{, i.e. } \P(A) \le \P(B).
- id: probability-statistics-set-theory-in-probability-4-01
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 4
  question: |
    \text{A system has 5 independent backup components, each failing independently with probability} \\
    0.1. \text{ The system fails only if all five components fail. Let } F_i \text{ be the event "component } i \\
    \text{ fails." Using set notation, express the event "the system survives" (at least one component} \\
    \text{works) in terms of the } F_i\text{, then find its probability.}
  answer: |
    \text{"System fails" is } F_1 \cap F_2 \cap \dots \cap F_5. \text{ By De Morgan's law, "system survives"} \\
    \text{(at least one component works) is the complement:} \\
    (F_1 \cap \dots \cap F_5)^c = F_1^c \cup F_2^c \cup \dots \cup F_5^c. \\
    \text{Since the components fail independently,} \\
    \P(F_1 \cap \dots \cap F_5) = \prod_{i=1}^5 \P(F_i) = 0.1^5 = 0.00001. \\
    \P(\text{system survives}) = 1 - \P(F_1\cap\dots\cap F_5) = 1 - 0.00001 = 0.99999.
- id: probability-statistics-set-theory-in-probability-4-02
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 4
  question: |
    n \text{ people check their hats, which are returned to them uniformly at random. Let } A_i \text{ be the} \\
    \text{event that person } i \text{ gets back their own hat. Using inclusion-exclusion on } A_1 \cup \dots \cup A_n, \\
    \text{find the probability that nobody gets back their own hat, as } n \to \infty.
  answer: |
    \text{For any subset } S \subseteq \{1,\dots,n\} \text{ of size } k, \P\!\left(\bigcap_{i\in S} A_i\right) = \dfrac{(n-k)!}{n!} \\
    \text{(the } k \text{ specified people keep their own hats, the rest are an arbitrary permutation).} \\
    \text{There are } \binom{n}{k} \text{ such subsets, so inclusion-exclusion gives} \\
    \P\!\left(\bigcup_{i=1}^n A_i\right) = \sum_{k=1}^n (-1)^{k+1} \binom{n}{k} \frac{(n-k)!}{n!} = \sum_{k=1}^n (-1)^{k+1} \frac{1}{k!}. \\
    \text{The probability nobody gets their own hat back is the complement:} \\
    1 - \sum_{k=1}^n (-1)^{k+1}\frac{1}{k!} = \sum_{k=0}^n \frac{(-1)^k}{k!}. \\
    \text{As } n \to \infty\text{, this partial sum converges to } e^{-1}\text{, so the probability approaches } \\
    \dfrac{1}{e} \approx 0.368.
- id: probability-statistics-set-theory-in-probability-4-03
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 4
  question: |
    \text{In a survey of 100 students, 60 study Math, 45 study Physics, 30 study Chemistry, 25 study} \\
    \text{both Math and Physics, 15 study both Math and Chemistry, 10 study both Physics and} \\
    \text{Chemistry, and 5 study all three. How many students study none of the three subjects?}
  answer: |
    \text{By inclusion-exclusion,} \\
    |M\cup P\cup C| = |M|+|P|+|C| - |M\cap P|-|M\cap C|-|P\cap C| + |M\cap P\cap C| \\
    = 60+45+30-25-15-10+5 = 90. \\
    \text{Students studying none of the three subjects: } 100 - 90 = 10.
- id: probability-statistics-set-theory-in-probability-4-04
  category: Probability & Statistics
  subtopic: Set Theory in Probability
  level: 4
  question: |
    \text{A piece of software runs 8 independent unit tests before release; each test fails (a false} \\
    \text{alarm) independently with probability } 0.02. \text{ Use the union bound to estimate an upper} \\
    \text{bound on the probability that at least one test fails, then compare it to the exact} \\
    \text{probability (computed via the complement).}
  answer: |
    \text{Union bound: } \P(\text{at least one test fails}) \le \sum_{i=1}^8 \P(\text{test } i \text{ fails}) = 8 \times 0.02 = 0.16. \\
    \text{Exact value, via the complement (independence lets the "no failures" probability factor):} \\
    \P(\text{no test fails}) = (0.98)^8 \approx 0.8508, \quad \P(\text{at least one fails}) = 1-0.8508 \approx 0.1492. \\
    \text{The union bound (0.16) is a valid upper bound on the exact probability (0.1492), as} \\
    \text{guaranteed by Boole's inequality — but it overcounts the overlap between different tests} \\
    \text{failing together, so it's noticeably looser than the true value.}
- id: economics-finance-time-value-of-money-1-01
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 1
  question: |
    \text{A single amount } PV \text{ is invested today at a periodic interest rate } r, \text{ compounded once} \\
    \text{per period, for } n \text{ periods. What is its future value } FV?
  answer: |
    FV = PV(1+r)^n
- id: economics-finance-time-value-of-money-1-02
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 1
  question: |
    \text{You will receive a single payment of } FV \text{ in } n \text{ periods. If the periodic discount rate} \\
    \text{is } r, \text{ what is its present value } PV?
  answer: |
    PV = \dfrac{FV}{(1+r)^n}
- id: economics-finance-time-value-of-money-1-03
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 1
  question: |
    \text{\$1{,}000 is invested for 3 years at an annual rate of 5\%. Compare the accumulated value} \\
    \text{under simple interest to the accumulated value under interest compounded annually.}
  answer: |
    \begin{aligned}
    \text{Simple interest: } A &= P(1+rn) = 1000(1+0.05\cdot 3) = \$1{,}150.00 \\
    \text{Compound interest: } A &= P(1+r)^n = 1000(1.05)^3 = \$1{,}157.63
    \end{aligned} \\
    \text{Compounding yields \$7.63 more, since interest earns interest in later years.}
- id: economics-finance-time-value-of-money-1-04
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 1
  question: |
    \text{A perpetuity pays a fixed amount } C \text{ at the end of every period, forever, discounted at} \\
    \text{periodic rate } r>0. \text{ What is its present value?}
  answer: |
    PV = \dfrac{C}{r}
- id: economics-finance-time-value-of-money-2-01
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 2
  question: |
    \text{An ordinary annuity pays a fixed amount } C \text{ at the end of each of the next } n \text{ periods,} \\
    \text{discounted at periodic rate } r. \text{ State its present value, and compute it for} \\
    C=\$1{,}000,\ r=6\%,\ n=5.
  answer: |
    PV = C\cdot\dfrac{1-(1+r)^{-n}}{r} = 1000\cdot\dfrac{1-(1.06)^{-5}}{0.06} \approx \$4{,}212.36
- id: economics-finance-time-value-of-money-2-02
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 2
  question: |
    \text{An ordinary annuity pays a fixed amount } C \text{ at the end of each of the next } n \text{ periods,} \\
    \text{with periodic interest rate } r. \text{ State its future value (at the time of the last payment),} \\
    \text{and compute it for } C=\$500,\ r=4\%,\ n=10.
  answer: |
    FV = C\cdot\dfrac{(1+r)^{n}-1}{r} = 500\cdot\dfrac{(1.04)^{10}-1}{0.04} \approx \$6{,}003.05
- id: economics-finance-time-value-of-money-2-03
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 2
  question: |
    \text{An ordinary annuity of } n=8 \text{ annual payments of } \$2{,}000 \text{ at } r=5\% \text{ has present value} \\
    PV_{ord}. \text{ If the same 8 payments are instead made at the } \textbf{start} \text{ of each year} \\
    \text{(an annuity due), what is the new present value } PV_{due}, \text{ and how does it relate to } PV_{ord}?
  answer: |
    \begin{aligned}
    PV_{ord} &= 2000\cdot\dfrac{1-(1.05)^{-8}}{0.05} \approx \$12{,}926.45 \\
    PV_{due} &= PV_{ord}\cdot(1+r) \approx \$13{,}572.77
    \end{aligned} \\
    \text{Each annuity-due payment arrives one period earlier than the matching ordinary-annuity} \\
    \text{payment, so every term is discounted one fewer period — equivalent to multiplying the} \\
    \text{whole ordinary annuity's value by } (1+r).
- id: economics-finance-time-value-of-money-2-04
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 2
  question: |
    \text{A loan quotes a nominal annual rate of 12\%, compounded monthly. What is the effective} \\
    \text{annual rate (} EAR \text{)?}
  answer: |
    EAR = \left(1+\dfrac{0.12}{12}\right)^{12} - 1 = (1.01)^{12} - 1 \approx 12.68\%
- id: economics-finance-time-value-of-money-2-05
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 2
  question: |
    \text{A growing perpetuity pays } C_1 \text{ at the end of period 1, with each subsequent payment} \\
    \text{growing at rate } g, \text{ discounted at rate } r>g. \text{ State its present value, and compute it for} \\
    C_1=\$100,\ g=3\%,\ r=8\%.
  answer: |
    PV = \dfrac{C_1}{r-g} = \dfrac{100}{0.08-0.03} = \$2{,}000
- id: economics-finance-time-value-of-money-2-06
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 2
  question: |
    \text{A project requires an initial outlay of \$10{,}000 today and returns \$4{,}000 at the end of} \\
    \text{year 1, \$5{,}000 at the end of year 2, and \$3{,}000 at the end of year 3. At a discount rate} \\
    \text{of 7\%, what is the project's } NPV, \text{ and is it worth undertaking?}
  answer: |
    NPV = -10{,}000 + \dfrac{4{,}000}{1.07} + \dfrac{5{,}000}{1.07^2} + \dfrac{3{,}000}{1.07^3} \\
    \approx -10{,}000 + 3{,}738.32 + 4{,}367.19 + 2{,}449.00 = \$554.51 \\
    \text{Since } NPV>0, \text{ the project is worth undertaking.}
- id: economics-finance-time-value-of-money-3-01
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 3
  question: |
    \text{Derive the ordinary-annuity present-value formula } PV = C\cdot\dfrac{1-(1+r)^{-n}}{r} \text{ starting} \\
    \text{from } PV=\displaystyle\sum_{t=1}^n \dfrac{C}{(1+r)^t}, \text{ using the geometric series sum.}
  answer: |
    \begin{aligned}
    PV &= C\sum_{t=1}^n x^t, \quad x=\dfrac{1}{1+r} \\
    \sum_{t=1}^n x^t &= x\cdot\dfrac{1-x^n}{1-x} \quad \text{(finite geometric series)} \\
    1-x &= 1-\dfrac{1}{1+r} = \dfrac{r}{1+r} \\
    \sum_{t=1}^n x^t &= \dfrac{\frac{1}{1+r}\left(1-(1+r)^{-n}\right)}{\frac{r}{1+r}} = \dfrac{1-(1+r)^{-n}}{r} \\
    PV &= C\cdot\dfrac{1-(1+r)^{-n}}{r}
    \end{aligned}
- id: economics-finance-time-value-of-money-3-02
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 3
  question: |
    \text{Show that the perpetuity formula } PV=\dfrac{C}{r} \text{ arises as the } n\to\infty \text{ limit of the} \\
    \text{ordinary-annuity formula } PV_n = C\cdot\dfrac{1-(1+r)^{-n}}{r}, \text{ and explain why this limit} \\
    \text{requires } r>0.
  answer: |
    \begin{aligned}
    PV_n &= C\cdot\dfrac{1-(1+r)^{-n}}{r}
    \end{aligned} \\
    \text{If } r>0 \text{ then } 1+r>1, \text{ so } (1+r)^{-n}\to 0 \text{ as } n\to\infty, \text{ giving} \\
    \lim_{n\to\infty} PV_n = C\cdot\dfrac{1-0}{r} = \dfrac{C}{r}. \\
    \text{If } r\le 0, \text{ then } 1+r\le 1, \text{ so } (1+r)^{-n} \text{ does not shrink to } 0 \text{ (it stays} \ge 1 \\
    \text{or is undefined/diverges), and the sum of an infinite stream of equal payments has no} \\
    \text{finite present value — the perpetuity formula only holds for a strictly positive discount rate.}
- id: economics-finance-time-value-of-money-3-03
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 3
  question: |
    \text{Derive the growing-perpetuity formula } PV=\dfrac{C_1}{r-g} \text{ from} \\
    PV=\displaystyle\sum_{t=1}^{\infty}\dfrac{C_1(1+g)^{t-1}}{(1+r)^t}, \text{ and state the condition on } r \text{ and } g \\
    \text{needed for the series to converge.}
  answer: |
    \begin{aligned}
    PV &= \dfrac{C_1}{1+r}\sum_{t=1}^{\infty}\left(\dfrac{1+g}{1+r}\right)^{t-1}, \quad x=\dfrac{1+g}{1+r} \\
    \sum_{t=1}^{\infty} x^{t-1} &= \dfrac{1}{1-x} \quad \text{(infinite geometric series, valid for } |x|<1\text{)} \\
    PV &= \dfrac{C_1}{1+r}\cdot\dfrac{1}{1-\frac{1+g}{1+r}} = \dfrac{C_1}{1+r}\cdot\dfrac{1+r}{(1+r)-(1+g)} = \dfrac{C_1}{r-g}
    \end{aligned} \\
    \text{Convergence requires } \left|\dfrac{1+g}{1+r}\right|<1, \text{ i.e. } r>g.
- id: economics-finance-time-value-of-money-3-04
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 3
  question: |
    \text{Show that } \displaystyle\lim_{m\to\infty}\left(1+\dfrac{r}{m}\right)^{mt} = e^{rt}, \text{ and use this result to express} \\
    \text{the continuously-compounded rate } r_{cc} \text{ equivalent to a given effective annual rate } EAR.
  answer: |
    \begin{aligned}
    \ln\left[\left(1+\dfrac{r}{m}\right)^{mt}\right] &= mt\ln\!\left(1+\dfrac{r}{m}\right)
    \end{aligned} \\
    \text{As } m\to\infty,\ r/m\to 0, \text{ and } \ln(1+x)\approx x \text{ for small } x, \text{ so} \\
    mt\ln\!\left(1+\dfrac{r}{m}\right) \to mt\cdot\dfrac{r}{m} = rt. \\
    \text{Exponentiating, } \left(1+\dfrac{r}{m}\right)^{mt} \to e^{rt}. \\
    \text{Setting } t=1, \text{ a continuously-compounded rate } r_{cc} \text{ matches a given } EAR \text{ when} \\
    e^{r_{cc}} = 1+EAR, \text{ i.e. } r_{cc} = \ln(1+EAR).
- id: economics-finance-time-value-of-money-4-01
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 4
  question: |
    \text{You take out a \$250{,}000 mortgage at a nominal annual rate of 6\%, compounded monthly,} \\
    \text{to be repaid in equal monthly installments over 30 years. What is the monthly payment?}
  answer: |
    \text{Monthly rate } r=0.06/12=0.005, \ n=360 \text{ payments.} \\
    \text{Solving } PV = C\cdot\dfrac{1-(1+r)^{-n}}{r} \text{ for } C: \\
    C = \dfrac{PV\cdot r}{1-(1+r)^{-n}} = \dfrac{250{,}000\times 0.005}{1-(1.005)^{-360}} \approx \$1{,}498.88
- id: economics-finance-time-value-of-money-4-02
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 4
  question: |
    \text{You are offered \$8{,}000 today or \$10{,}000 in 4 years. If your discount rate is 6\% per year,} \\
    \text{which option has the greater present value, and by how much?}
  answer: |
    \text{PV of the delayed payment: } \dfrac{10{,}000}{(1.06)^4} \approx \$7{,}921.35 \\
    \text{This is less than the \$8{,}000 offered today, so taking \$8{,}000 now is better, by about} \\
    \$8{,}000 - \$7{,}921.35 = \$78.65 \text{ in present-value terms.}
- id: economics-finance-time-value-of-money-4-03
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 4
  question: |
    \text{You want to accumulate \$500{,}000 in 20 years by making equal end-of-year deposits into} \\
    \text{an account earning 7\% annually. What annual deposit is required?}
  answer: |
    \text{Solving } FV = C\cdot\dfrac{(1+r)^n-1}{r} \text{ for } C: \\
    C = \dfrac{FV\cdot r}{(1+r)^n-1} = \dfrac{500{,}000\times 0.07}{(1.07)^{20}-1} \approx \$12{,}195.10 \text{ per year}
- id: economics-finance-time-value-of-money-4-04
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 4
  question: |
    \text{An investment of \$5{,}000 grows to \$10{,}000 in 9 years with annual compounding. What} \\
    \text{annual interest rate does this imply, and how does it compare to the quick Rule-of-72} \\
    \text{estimate for doubling in 9 years?}
  answer: |
    \text{Solve } (1+r)^9 = 2: \quad r = 2^{1/9}-1 \approx 8.01\% \\
    \text{Rule of 72 estimate: } r\approx \dfrac{72}{9} = 8\%. \\
    \text{The quick estimate (8\%) is very close to the exact rate (8.01\%), which is typical of the} \\
    \text{Rule of 72's accuracy for rates in the single-digit-to-low-teens range.}
- id: economics-finance-time-value-of-money-4-05
  category: Economics & Finance
  subtopic: Time Value of Money
  level: 4
  question: |
    \text{Bank A offers a savings account at a nominal annual rate of 5.9\%, compounded monthly.} \\
    \text{Bank B offers 6.0\%, compounded annually. Which account effectively pays more, and what} \\
    \text{are the two effective annual rates?}
  answer: |
    EAR_A = \left(1+\dfrac{0.059}{12}\right)^{12} - 1 \approx 6.062\% \\
    EAR_B = 6.0\% \quad \text{(annual compounding means the nominal and effective rates coincide)} \\
    \text{Although Bank A quotes a lower nominal rate, its more frequent compounding pushes its} \\
    \text{effective annual rate (6.062\%) above Bank B's (6.0\%), so Bank A effectively pays more.}
- id: economics-finance-inflation-and-interest-rates-1-01
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 1
  question: |
    \text{What is the } \textbf{nominal interest rate}, \text{ and what does it fail to} \\
    \text{account for?}
  answer: |
    \text{The nominal interest rate is the stated rate of return on an investment or loan, with} \\
    \text{no adjustment for the loss of purchasing power caused by inflation.}
- id: economics-finance-inflation-and-interest-rates-1-02
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 1
  question: |
    \text{What is the } \textbf{real interest rate}, \text{ and what exact relationship (the} \\
    \textbf{Fisher equation}\text{) links it to the nominal rate } r \text{ and the inflation rate } \pi?
  answer: |
    \text{The real interest rate is the rate at which purchasing power grows, after removing the} \\
    \text{effect of inflation from the nominal rate. The exact Fisher equation states} \\
    (1+r) = (1+r_{real})(1+\pi), \quad \text{equivalently} \quad r_{real} = \dfrac{1+r}{1+\pi}-1.
- id: economics-finance-inflation-and-interest-rates-1-03
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 1
  question: |
    \text{State the commonly used linear approximation to the exact Fisher equation} \\
    (1+r)=(1+r_{real})(1+\pi), \text{ and explain when it stays accurate.}
  answer: |
    \begin{aligned}
    r &\approx r_{real} + \pi \quad \text{(equivalently } r_{real}\approx r-\pi\text{)}
    \end{aligned} \\
    \text{Expanding the exact relation gives } r = r_{real}+\pi+r_{real}\pi, \text{ so the approximation} \\
    \text{simply drops the cross term } r_{real}\pi. \text{ It stays accurate whenever both } r_{real} \\
    \text{and } \pi \text{ are small (roughly single-digit percentages), since their product is then} \\
    \text{second-order small; it breaks down at high inflation.}
- id: economics-finance-inflation-and-interest-rates-1-04
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 1
  question: |
    \text{What are } \textbf{Treasury Inflation-Protected Securities (TIPS)}, \text{ and how do their} \\
    \text{principal and coupon payments respond to inflation?}
  answer: |
    \text{TIPS are U.S. Treasury bonds whose principal is periodically adjusted in line with the} \\
    \text{CPI. Because the fixed coupon rate is applied to this inflation-adjusted principal, the} \\
    \text{dollar coupon payment rises (or falls) with inflation too, and at maturity the holder is} \\
    \text{repaid the greater of the inflation-adjusted principal or the original par value.}
- id: economics-finance-inflation-and-interest-rates-1-05
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 1
  question: |
    \text{What is the } \textbf{breakeven inflation rate}, \text{ and how is it computed from the yields} \\
    \text{of a nominal Treasury bond and a TIPS of the same maturity?}
  answer: |
    \text{Breakeven inflation} = y_{nominal} - y_{TIPS}, \text{ the nominal Treasury yield minus the} \\
    \text{TIPS (real) yield of matching maturity. It represents the market's average expected} \\
    \text{inflation rate over that maturity: realized inflation above this level makes the TIPS the} \\
    \text{better holding, and realized inflation below it favors the nominal bond.}
- id: economics-finance-inflation-and-interest-rates-1-06
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 1
  question: |
    \text{Nominal bond yields typically include an } \textbf{inflation risk premium} \text{ on top of} \\
    \text{expected inflation. What is this premium compensating investors for, and how does it} \\
    \text{bias the breakeven inflation rate as a measure of expected inflation?}
  answer: |
    \text{It compensates investors for the } \textit{uncertainty} \text{ around future inflation: a nominal} \\
    \text{bond's fixed payments lose real value if inflation turns out higher than expected, a risk} \\
    \text{a TIPS holder doesn't bear. Because nominal yields embed this premium, the breakeven} \\
    \text{inflation rate (} y_{nominal}-y_{TIPS} \text{) overstates the market's true expected inflation by} \\
    \text{roughly the size of this premium (plus any liquidity difference between the two securities).}
- id: economics-finance-inflation-and-interest-rates-2-01
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 2
  question: |
    \text{A one-year investment offers a nominal rate of } 8\%, \text{ and expected inflation over the} \\
    \text{year is } 3\%. \text{ Using the exact Fisher equation, what is the real interest rate?}
  answer: |
    r_{real} = \dfrac{1+r}{1+\pi}-1 = \dfrac{1.08}{1.03}-1 \approx 4.85\%
- id: economics-finance-inflation-and-interest-rates-2-02
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 2
  question: |
    \text{A 10-year nominal Treasury bond yields } 4.2\%, \text{ and a 10-year TIPS of the same} \\
    \text{maturity yields } 1.5\% \text{ (real). What is the market-implied breakeven inflation rate?}
  answer: |
    \text{Breakeven inflation} = y_{nominal}-y_{TIPS} = 4.2\%-1.5\% = 2.7\%
- id: economics-finance-inflation-and-interest-rates-2-03
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 2
  question: |
    \text{An economy has a real interest rate of } 5\% \text{ and expected inflation of } 20\%. \text{ Compute} \\
    \text{the nominal rate using (a) the exact Fisher equation and (b) the approximate relation} \\
    r\approx r_{real}+\pi. \text{ By how much does the approximation miss?}
  answer: |
    \begin{aligned}
    \text{(a) Exact: } (1+r) &= (1.05)(1.20) = 1.26 \implies r = 26\% \\
    \text{(b) Approx: } r &\approx 5\%+20\% = 25\%
    \end{aligned} \\
    \text{The approximation misses by } 1 \text{ percentage point, exactly the dropped cross term} \\
    r_{real}\pi = 0.05\times 0.20 = 1\%. \text{ At high inflation this cross term is no longer} \\
    \text{negligible, so the approximation noticeably understates the true nominal rate.}
- id: economics-finance-inflation-and-interest-rates-2-04
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 2
  question: |
    \text{A TIPS has an original principal of \$1{,}000 and a real coupon rate of } 2\% \text{ per year.} \\
    \text{Over the first year, the CPI rises } 4\%. \text{ What is the inflation-adjusted principal at} \\
    \text{year-end, and what dollar coupon is paid for that year?}
  answer: |
    \begin{aligned}
    \text{Adjusted principal} &= 1000\times 1.04 = \$1{,}040 \\
    \text{Coupon paid} &= 2\%\times 1{,}040 = \$20.80
    \end{aligned} \\
    \text{Both the principal and the coupon rise with CPI — compared to a conventional bond,} \\
    \text{which would still pay just \$20 on an unchanged \$1{,}000 principal.}
- id: economics-finance-inflation-and-interest-rates-2-05
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 2
  question: |
    \text{An investor earns a } 7\% \text{ nominal return over a year in which realized inflation turns} \\
    \text{out to be } 4.5\%. \text{ What is the investor's exact real return for the year?}
  answer: |
    r_{real} = \dfrac{1.07}{1.045}-1 \approx 2.39\%
- id: economics-finance-inflation-and-interest-rates-2-06
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 2
  question: |
    \text{Inflation unexpectedly rises well above the rate priced into a nominal bond's yield at} \\
    \text{issuance. Explain, with reference to each security's payoff structure, why a fixed-rate} \\
    \text{nominal bondholder loses real purchasing power from this shock while a TIPS holder is} \\
    \text{largely protected.}
  answer: |
    \text{The nominal bond pays fixed dollar coupons and principal regardless of the inflation} \\
    \text{path; its yield at issuance only priced in the } \textit{expected} \text{ inflation at that time, so} \\
    \text{those fixed cash flows are worth less in real terms once actual inflation comes in higher} \\
    \text{than expected — the holder's realized real return falls short of what was priced in. A} \\
    \text{TIPS's principal (and so its coupon, paid on that principal) scales automatically with the} \\
    \text{CPI, so its real cash flows are preserved regardless of the inflation surprise — the TIPS} \\
    \text{holder's real return stays close to the real yield locked in at purchase.}
- id: economics-finance-inflation-and-interest-rates-2-07
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 2
  question: |
    \text{A perpetual bond pays a fixed annual coupon of \$50. If the market discount rate (yield)} \\
    \text{rises from } 5\% \text{ to } 6\%, \text{ what happens to the bond's price, and by what percentage} \\
    \text{does it fall?}
  answer: |
    \begin{aligned}
    P_{old} &= \dfrac{50}{0.05} = \$1{,}000 \\
    P_{new} &= \dfrac{50}{0.06} \approx \$833.33
    \end{aligned} \\
    \text{Percentage change} = \dfrac{833.33-1{,}000}{1{,}000} \approx -16.67\%. \\
    \text{Bond prices move inversely with interest rates because the present value of a fixed set} \\
    \text{of future cash flows falls whenever the discount rate used to value them rises.}
- id: economics-finance-inflation-and-interest-rates-2-08
  category: Economics & Finance
  subtopic: Inflation and Interest Rates
  level: 2
  question: |
    \text{You hold \$10{,}000 in cash, earning } 0\% \text{ nominal interest, while inflation averages } 3\% \\
    \text{per year. What is the real (inflation-adjusted) value of that cash after 5 years?}
  answer: |
    \text{Real value} = \dfrac{10{,}000}{(1.03)^5} \approx \$8{,}626.09 \\
    \text{The cash loses about } 13.7\% \text{ of its purchasing power over the 5 years, since it earns} \\
    \text{no nominal return at all to offset inflation.}
- id: probability-statistics-expected-value-variance-and-covariance-1-01
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 1
  question: |
    \text{For a discrete random variable } X \text{ with values } x_i \text{ and pmf } p(x_i), \text{ state the} \\
    \text{definition of } \E[X], \text{ and compute it for } \P(X=1)=0.2,\ \P(X=2)=0.5,\ \P(X=3)=0.3.
  answer: |
    \E[X] = \sum_i x_i\, p(x_i) \\
    \E[X] = 1(0.2) + 2(0.5) + 3(0.3) = 0.2+1.0+0.9 = 2.1
- id: probability-statistics-expected-value-variance-and-covariance-1-02
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 1
  question: |
    \text{For a continuous random variable } X \text{ with pdf } f(x), \text{ state the definition of } \E[X], \\
    \text{and compute it for } f(x) = 2x \text{ on } [0,1] \text{ (and } 0 \text{ elsewhere).}
  answer: |
    \begin{aligned}
    \E[X] &= \int_{-\infty}^{\infty} x f(x)\,dx \\
    &= \int_0^1 x(2x)\,dx = \int_0^1 2x^2\,dx \\
    &= \left[\dfrac{2x^3}{3}\right]_0^1 = \dfrac{2}{3}
    \end{aligned}
- id: probability-statistics-expected-value-variance-and-covariance-1-03
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 1
  question: |
    \text{State the linearity-of-expectation formula for } \E[aX+bY+c], \text{ and note whether it requires} \\
    X \text{ and } Y \text{ to be independent.}
  answer: |
    \E[aX+bY+c] = a\E[X]+b\E[Y]+c \\
    \text{This holds for any } X,Y \text{ and any constants } a,b,c \text{ — independence is } \textbf{not} \text{ required.}
- id: probability-statistics-expected-value-variance-and-covariance-1-04
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 1
  question: |
    \text{State the definition of } \Var(X), \text{ and compute it for } X \text{ taking values } -1,0,1 \text{ each} \\
    \text{with probability } \tfrac{1}{3}.
  answer: |
    \begin{aligned}
    \Var(X) &= \E\big[(X-\E[X])^2\big] \\
    \E[X] &= \dfrac{-1+0+1}{3} = 0 \\
    \Var(X) &= \dfrac{(-1-0)^2+(0-0)^2+(1-0)^2}{3} = \dfrac{2}{3}
    \end{aligned}
- id: probability-statistics-expected-value-variance-and-covariance-1-05
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 1
  question: |
    \text{State the shortcut (computational) formula for } \Var(X) \text{ in terms of } \E[X^2] \text{ and } \E[X], \text{ and} \\
    \text{use it to recompute } \Var(X) \text{ for } X \text{ taking values } -1,0,1 \text{ each with probability } \tfrac{1}{3}.
  answer: |
    \begin{aligned}
    \Var(X) &= \E[X^2] - (\E[X])^2 \\
    \E[X] &= 0, \qquad \E[X^2] = \dfrac{(-1)^2+0^2+1^2}{3} = \dfrac{2}{3} \\
    \Var(X) &= \dfrac{2}{3} - 0^2 = \dfrac{2}{3}
    \end{aligned}
- id: probability-statistics-expected-value-variance-and-covariance-1-06
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 1
  question: |
    \text{State the formula for } \Var(aX+b) \text{ in terms of } \Var(X), \text{ for constants } a,b.
  answer: |
    \Var(aX+b) = a^2 \Var(X)
- id: probability-statistics-expected-value-variance-and-covariance-1-07
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 1
  question: |
    \text{State the definition of } \Cov(X,Y) \text{ in terms of } \E[\cdot].
  answer: |
    \Cov(X,Y) = \E\big[(X-\E[X])(Y-\E[Y])\big]
- id: probability-statistics-expected-value-variance-and-covariance-1-08
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 1
  question: |
    \text{State the shortcut (computational) formula for } \Cov(X,Y) \text{ in terms of } \E[XY], \E[X], \E[Y], \text{ and} \\
    \text{use it to compute } \Cov(X,Y) \text{ given } \E[XY]=10, \ \E[X]=2, \ \E[Y]=4.
  answer: |
    \begin{aligned}
    \Cov(X,Y) &= \E[XY] - \E[X]\E[Y] \\
    \Cov(X,Y) &= 10 - (2)(4) = 2
    \end{aligned}
- id: probability-statistics-expected-value-variance-and-covariance-1-09
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 1
  question: |
    \text{State the definition of } \Corr(X,Y) \text{ in terms of } \Cov(X,Y) \text{ and the standard deviations of } X,Y.
  answer: |
    \Corr(X,Y) = \dfrac{\Cov(X,Y)}{\sigma_X \sigma_Y}, \qquad \sigma_X = \sqrt{\Var(X)}, \ \sigma_Y = \sqrt{\Var(Y)}
- id: probability-statistics-expected-value-variance-and-covariance-2-01
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 2
  question: |
    \text{Show that } \Cov(X,X) = \Var(X).
  answer: |
    \begin{aligned}
    \Cov(X,X) &= \E\big[(X-\E[X])(X-\E[X])\big] \\
    &= \E\big[(X-\E[X])^2\big] = \Var(X)
    \end{aligned}
- id: probability-statistics-expected-value-variance-and-covariance-2-02
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 2
  question: |
    \text{Show that } \Cov(aX+b,\, cY+d) = ac\,\Cov(X,Y) \text{ for constants } a,b,c,d.
  answer: |
    \begin{aligned}
    \Cov(aX+b, cY+d) &= \E\big[(aX+b-\E[aX+b])(cY+d-\E[cY+d])\big] \\
    &= \E\big[(aX - a\E[X])(cY - c\E[Y])\big] \\
    &= ac\,\E\big[(X-\E[X])(Y-\E[Y])\big] \\
    &= ac\,\Cov(X,Y)
    \end{aligned}
- id: probability-statistics-expected-value-variance-and-covariance-2-03
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 2
  question: |
    \text{Derive the formula for } \Var(X+Y) \text{ in terms of } \Var(X), \Var(Y), \text{ and } \Cov(X,Y).
  answer: |
    \begin{aligned}
    \Var(X+Y) &= \E\big[((X+Y)-\E[X+Y])^2\big] \\
    &= \E\big[((X-\E[X])+(Y-\E[Y]))^2\big] \\
    &= \E\big[(X-\E[X])^2\big] + \E\big[(Y-\E[Y])^2\big] + 2\E\big[(X-\E[X])(Y-\E[Y])\big] \\
    &= \Var(X) + \Var(Y) + 2\Cov(X,Y)
    \end{aligned}
- id: probability-statistics-expected-value-variance-and-covariance-2-04
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 2
  question: |
    \text{Derive the formula for } \Var(X-Y) \text{ in terms of } \Var(X), \Var(Y), \text{ and } \Cov(X,Y).
  answer: |
    \begin{aligned}
    \Var(X-Y) &= \Var(X + (-Y)) = \Var(X) + \Var(-Y) + 2\Cov(X,-Y) \\
    &= \Var(X) + \Var(Y) - 2\Cov(X,Y)
    \end{aligned} \\
    \text{using } \Var(-Y)=(-1)^2\Var(Y)=\Var(Y) \text{ and } \Cov(X,-Y)=-\Cov(X,Y) \text{ (bilinearity).}
- id: probability-statistics-expected-value-variance-and-covariance-2-05
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 2
  question: |
    \text{If } X \text{ and } Y \text{ are independent, show that } \Cov(X,Y)=0, \text{ and state what this implies} \\
    \text{for } \Var(X+Y).
  answer: |
    \begin{aligned}
    X,Y \text{ independent} &\Rightarrow \E[XY] = \E[X]\E[Y] \\
    \Cov(X,Y) &= \E[XY]-\E[X]\E[Y] = 0
    \end{aligned} \\
    \text{Since } \Var(X+Y)=\Var(X)+\Var(Y)+2\Cov(X,Y), \text{ this gives } \Var(X+Y)=\Var(X)+\Var(Y).
- id: probability-statistics-expected-value-variance-and-covariance-2-06
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 2
  question: |
    \text{Given } \Var(X)=4, \ \Var(Y)=9, \text{ is } \Cov(X,Y)=7 \text{ a possible value? Use the fact that} \\
    \Corr(X,Y)\in[-1,1].
  answer: |
    \Corr(X,Y) = \dfrac{\Cov(X,Y)}{\sqrt{\Var(X)}\sqrt{\Var(Y)}} = \dfrac{7}{\sqrt{4}\sqrt{9}} = \dfrac{7}{6} \approx 1.17 \\
    \text{Since } \tfrac{7}{6} > 1, \text{ this violates } \Corr(X,Y)\in[-1,1], \text{ so } \Cov(X,Y)=7 \text{ is impossible} \\
    \text{for these variances.}
- id: probability-statistics-expected-value-variance-and-covariance-2-07
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 2
  question: |
    \text{Given the joint pmf of } X,Y \text{ below, compute } \Cov(X,Y) \text{ and } \Corr(X,Y). \\
    \begin{array}{c|cc}
     & Y=0 & Y=1 \\
    \hline
    X=0 & 0.4 & 0.1 \\
    X=1 & 0.1 & 0.4
    \end{array}
  answer: |
    \begin{aligned}
    \E[X] &= 0(0.5)+1(0.5)=0.5, \qquad \E[Y]=0.5 \\
    \E[XY] &= (1)(1)(0.4) = 0.4 \\
    \Cov(X,Y) &= \E[XY]-\E[X]\E[Y] = 0.4-0.25=0.15 \\
    \Var(X) &= \E[X^2]-(\E[X])^2 = 0.5-0.25=0.25, \qquad \Var(Y)=0.25 \\
    \Corr(X,Y) &= \dfrac{0.15}{\sqrt{0.25}\sqrt{0.25}} = \dfrac{0.15}{0.25} = 0.6
    \end{aligned}
- id: probability-statistics-expected-value-variance-and-covariance-2-08
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 2
  question: |
    \text{Let } X \text{ be uniform on } \{-1,0,1\} \text{ and let } Y=X^2. \text{ Show that } \Cov(X,Y)=0 \text{ even though} \\
    Y \text{ is a deterministic function of } X \text{ (so } X,Y \text{ are not independent).}
  answer: |
    \begin{aligned}
    \E[X] &= \dfrac{-1+0+1}{3} = 0 \\
    \E[XY] &= \E[X^3] = \dfrac{(-1)^3+0^3+1^3}{3} = \dfrac{-1+0+1}{3}=0 \\
    \Cov(X,Y) &= \E[XY]-\E[X]\E[Y] = 0 - 0\cdot\E[Y] = 0
    \end{aligned} \\
    \text{So } X \text{ and } Y \text{ are uncorrelated, yet } Y=X^2 \text{ is completely determined by } X \text{ —} \\
    \text{uncorrelated does not imply independent.}
- id: probability-statistics-expected-value-variance-and-covariance-3-01
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 3
  question: |
    \text{Prove that } |\Corr(X,Y)| \le 1 \text{ for any random variables } X,Y \text{ with finite, positive variance.}
  answer: |
    \text{Let } U = \dfrac{X-\E[X]}{\sigma_X}, \ V = \dfrac{Y-\E[Y]}{\sigma_Y}. \text{ By bilinearity of covariance,} \\
    \Var(U)=\Var(V)=1 \text{ and } \Cov(U,V) = \dfrac{\Cov(X,Y)}{\sigma_X\sigma_Y} = \Corr(X,Y). \text{ Since variance is} \\
    \text{always non-negative:} \\
    \begin{aligned}
    \Var(U-V) &= \Var(U)+\Var(V)-2\Cov(U,V) = 2-2\Corr(X,Y) \ge 0 \ \Rightarrow\ \Corr(X,Y)\le 1 \\
    \Var(U+V) &= \Var(U)+\Var(V)+2\Cov(U,V) = 2+2\Corr(X,Y) \ge 0 \ \Rightarrow\ \Corr(X,Y)\ge -1
    \end{aligned} \\
    \text{Together, } |\Corr(X,Y)| \le 1.
- id: probability-statistics-expected-value-variance-and-covariance-3-02
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 3
  question: |
    \text{Prove the general bilinearity of covariance: for constants } a_i,c_j \text{ and random variables } X_i,Y_j, \\
    \Cov\!\left(\sum_{i=1}^m a_iX_i,\ \sum_{j=1}^n c_jY_j\right) = \sum_{i=1}^m\sum_{j=1}^n a_ic_j\,\Cov(X_i,Y_j).
  answer: |
    \begin{aligned}
    \Cov\!\left(\sum_i a_iX_i, \sum_j c_jY_j\right)
    &= \E\!\left[\Big(\sum_i a_i(X_i-\E[X_i])\Big)\Big(\sum_j c_j(Y_j-\E[Y_j])\Big)\right] \\
    &= \E\!\left[\sum_i\sum_j a_ic_j(X_i-\E[X_i])(Y_j-\E[Y_j])\right] \\
    &= \sum_i\sum_j a_ic_j\,\E\big[(X_i-\E[X_i])(Y_j-\E[Y_j])\big] \\
    &= \sum_i\sum_j a_ic_j\,\Cov(X_i,Y_j)
    \end{aligned} \\
    \text{(centering each sum by subtracting its mean, expanding the product, then linearity of} \\
    \text{expectation to pull the sums and constants out).}
- id: probability-statistics-expected-value-variance-and-covariance-3-03
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 3
  question: |
    \text{Prove that for random variables } X_1,\dots,X_n, \\
    \Var\!\left(\sum_{i=1}^n X_i\right) = \sum_{i=1}^n \Var(X_i) + 2\sum_{1\le i<j\le n} \Cov(X_i,X_j).
  answer: |
    \begin{aligned}
    \Var\!\left(\sum_{i=1}^n X_i\right)
    &= \Cov\!\left(\sum_{i=1}^n X_i,\ \sum_{j=1}^n X_j\right) \\
    &= \sum_{i=1}^n\sum_{j=1}^n \Cov(X_i,X_j) \\
    &= \sum_{i=1}^n \Cov(X_i,X_i) + \sum_{i\ne j} \Cov(X_i,X_j) \\
    &= \sum_{i=1}^n \Var(X_i) + 2\sum_{1\le i<j\le n} \Cov(X_i,X_j)
    \end{aligned} \\
    \text{using } \Var(Z)=\Cov(Z,Z), \text{ bilinearity to expand the double sum, } \Cov(X_i,X_i)=\Var(X_i), \text{ and} \\
    \text{that each unordered pair } \{i,j\} \text{ with } i\ne j \text{ appears twice (as } (i,j) \text{ and } (j,i)\text{) in the} \\
    \text{double sum.}
- id: probability-statistics-expected-value-variance-and-covariance-3-04
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 3
  question: |
    \text{Prove that } \Var(X) \ge 0 \text{ for any random variable } X, \text{ and that } \Var(X)=0 \text{ if and only if } X \\
    \text{is almost surely equal to a constant.}
  answer: |
    \Var(X) = \E\big[(X-\E[X])^2\big] \text{ is the expectation of the non-negative quantity } (X-\E[X])^2, \\
    \text{so } \Var(X)\ge 0. \\
    \text{(}\Rightarrow\text{) If } X=c \text{ a.s. for a constant } c, \text{ then } \E[X]=c, \text{ so } (X-\E[X])^2=0 \text{ a.s.} \\
    \text{and } \Var(X)=0. \\
    \text{(}\Leftarrow\text{) If } \Var(X)=0, \text{ then } \E\big[(X-\E[X])^2\big]=0 \text{ with } (X-\E[X])^2\ge 0 \text{ a.s. The} \\
    \text{expectation of a non-negative random variable is zero only if the variable itself is zero a.s.,} \\
    \text{so } X=\E[X] \text{ a.s. — i.e. } X \text{ is almost surely equal to the constant } \E[X].
- id: probability-statistics-expected-value-variance-and-covariance-4-01
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 4
  question: |
    \text{Two assets have returns } X,Y \text{ with } \Var(X)=\sigma_X^2, \ \Var(Y)=\sigma_Y^2, \text{ and correlation} \\
    \Corr(X,Y)=\rho. \text{ A portfolio holds weights } w_1,w_2 \text{ in the two assets. Find } \Var(w_1X+w_2Y).
  answer: |
    \begin{aligned}
    \Var(w_1X+w_2Y) &= w_1^2\Var(X) + w_2^2\Var(Y) + 2w_1w_2\Cov(X,Y) \\
    &= w_1^2\sigma_X^2 + w_2^2\sigma_Y^2 + 2w_1w_2\,\rho\,\sigma_X\sigma_Y
    \end{aligned} \\
    \text{using } \Cov(X,Y) = \Corr(X,Y)\,\sigma_X\sigma_Y = \rho\,\sigma_X\sigma_Y.
- id: probability-statistics-expected-value-variance-and-covariance-4-02
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 4
  question: |
    \text{A portfolio equally weights } n \text{ assets, each with variance } \sigma^2, \text{ and every pair of assets} \\
    \text{has the same correlation } \rho. \text{ Find the variance of the equally-weighted portfolio's return,} \\
    \text{and its limit as } n\to\infty.
  answer: |
    \begin{aligned}
    \Var\!\left(\dfrac{1}{n}\sum_{i=1}^n X_i\right)
    &= \dfrac{1}{n^2}\left(\sum_{i=1}^n \Var(X_i) + 2\sum_{i<j}\Cov(X_i,X_j)\right) \\
    &= \dfrac{1}{n^2}\Big(n\sigma^2 + 2\binom{n}{2}\rho\sigma^2\Big) \\
    &= \dfrac{\sigma^2}{n} + \dfrac{n-1}{n}\rho\sigma^2
    \end{aligned} \\
    \text{As } n\to\infty, \text{ the first term vanishes and } \dfrac{n-1}{n}\to 1, \text{ so the variance } \to \rho\sigma^2: \\
    \text{idiosyncratic risk diversifies away, leaving only the systematic risk set by the common} \\
    \text{correlation.}
- id: probability-statistics-expected-value-variance-and-covariance-4-03
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 4
  question: |
    \text{A fair coin is flipped } n \text{ times (independently). Let } X \text{ be the number of times two} \\
    \text{consecutive flips are both heads (overlapping occurrences count, e.g. HHH contains two).} \\
    \text{Find } \Var(X) \text{ in terms of } n.
  answer: |
    \text{Let } I_i = \mathbf{1}\{\text{flip } i \text{ and flip } i+1 \text{ are both heads}\} \text{ for } i=1,\dots,n-1, \text{ so} \\
    X=\sum_{i=1}^{n-1} I_i. \\
    \begin{aligned}
    \E[I_i] &= \P(\text{flip } i=H, \text{flip } i+1=H) = \tfrac14, \qquad \Var(I_i) = \tfrac14\big(1-\tfrac14\big) = \tfrac{3}{16}
    \end{aligned} \\
    \text{If } |i-j|\ge 2, \ I_i \text{ and } I_j \text{ involve disjoint flips, so they're independent and } \Cov(I_i,I_j)=0. \\
    \text{If } j=i+1, \ I_i \text{ and } I_{i+1} \text{ share flip } i+1, \text{ and } I_iI_{i+1}=1 \text{ iff flips } i,i+1,i+2 \text{ are} \\
    \text{all heads:} \\
    \begin{aligned}
    \Cov(I_i,I_{i+1}) &= \E[I_iI_{i+1}] - \E[I_i]\E[I_{i+1}] = \tfrac18 - \tfrac14\cdot\tfrac14 = \tfrac{1}{16}
    \end{aligned} \\
    \text{There are } n-1 \text{ indicators and } n-2 \text{ adjacent pairs, so:} \\
    \begin{aligned}
    \Var(X) &= \sum_{i=1}^{n-1}\Var(I_i) + 2\sum_{\text{adjacent}}\Cov(I_i,I_{i+1}) \\
    &= (n-1)\tfrac{3}{16} + 2(n-2)\tfrac{1}{16} = \dfrac{5n-7}{16}
    \end{aligned}
- id: probability-statistics-expected-value-variance-and-covariance-4-04
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 4
  question: |
    \text{Let } X,Y \text{ be independent with } \Var(X)=\Var(Y)=\sigma^2. \text{ Find } \Corr(X,\,X+Y).
  answer: |
    \begin{aligned}
    \Cov(X,X+Y) &= \Cov(X,X)+\Cov(X,Y) = \Var(X) + 0 = \sigma^2 \\
    \Var(X+Y) &= \Var(X)+\Var(Y) = 2\sigma^2 \qquad (\Cov(X,Y)=0 \text{ by independence}) \\
    \Corr(X,X+Y) &= \dfrac{\Cov(X,X+Y)}{\sqrt{\Var(X)}\sqrt{\Var(X+Y)}} = \dfrac{\sigma^2}{\sigma\cdot\sigma\sqrt{2}} = \dfrac{1}{\sqrt{2}}
    \end{aligned}
- id: probability-statistics-expected-value-variance-and-covariance-4-05
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 4
  question: |
    \text{Show that } \Cov(X+Y,\,X-Y) = \Var(X)-\Var(Y), \text{ and state the condition on } X,Y \text{ under which} \\
    X+Y \text{ and } X-Y \text{ are uncorrelated.}
  answer: |
    \begin{aligned}
    \Cov(X+Y,X-Y) &= \Cov(X,X) - \Cov(X,Y) + \Cov(Y,X) - \Cov(Y,Y) \\
    &= \Var(X) - \Cov(X,Y) + \Cov(X,Y) - \Var(Y) \\
    &= \Var(X) - \Var(Y)
    \end{aligned} \\
    \text{So } \Cov(X+Y,X-Y)=0 \text{ exactly when } \Var(X)=\Var(Y) \text{ — i.e. } X+Y \text{ and } X-Y \text{ are} \\
    \text{uncorrelated if and only if } X \text{ and } Y \text{ have equal variance (regardless of } \Cov(X,Y)\text{).}
- id: probability-statistics-expected-value-variance-and-covariance-4-06
  category: Probability & Statistics
  subtopic: Expected Value, Variance and Covariance
  level: 4
  question: |
    \text{Given the paired observations } (1,2),\ (2,1),\ (3,4),\ (4,3), \text{ compute the sample covariance and} \\
    \text{sample correlation between } X \text{ and } Y \text{ (treat each pair as equally likely, i.e. use the plain} \\
    \text{average).}
  answer: |
    \begin{aligned}
    \bar{x} &= \dfrac{1+2+3+4}{4} = 2.5, \qquad \bar{y} = \dfrac{2+1+4+3}{4} = 2.5 \\
    \Cov(X,Y) &= \dfrac{1}{4}\sum (x_i-\bar{x})(y_i-\bar{y}) = \dfrac{(-1.5)(-0.5)+(-0.5)(-1.5)+(0.5)(1.5)+(1.5)(0.5)}{4} = \dfrac{3}{4} = 0.75 \\
    \Var(X) &= \dfrac{1}{4}\sum (x_i-\bar{x})^2 = \dfrac{2.25+0.25+0.25+2.25}{4} = 1.25, \qquad \Var(Y) = 1.25 \text{ (same values, permuted)} \\
    \Corr(X,Y) &= \dfrac{\Cov(X,Y)}{\sqrt{\Var(X)}\sqrt{\Var(Y)}} = \dfrac{0.75}{1.25} = 0.6
    \end{aligned}
- id: probability-statistics-conditional-expectation-and-variance-1-01
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 1
  question: |
    \text{For discrete random variables } X,Y \text{ with the joint pmf below, state the definition of} \\
    \text{the conditional expectation } \E[X \mid Y=y], \text{ and compute } \E[X \mid Y=1].
    \begin{array}{c|cc}
     & Y=1 & Y=2 \\
    \hline
    X=1 & 0.1 & 0.3 \\
    X=2 & 0.2 & 0.4
    \end{array}
  answer: |
    \begin{aligned}
    \E[X \mid Y=y] &= \sum_x x\, \P(X=x \mid Y=y), \qquad \P(X=x\mid Y=y) = \dfrac{\P(X=x,Y=y)}{\P(Y=y)} \\
    \P(Y=1) &= 0.1+0.2 = 0.3 \\
    \P(X=1\mid Y=1) &= \dfrac{0.1}{0.3} = \dfrac13, \qquad \P(X=2\mid Y=1) = \dfrac{0.2}{0.3} = \dfrac23 \\
    \E[X\mid Y=1] &= 1\cdot\dfrac13 + 2\cdot\dfrac23 = \dfrac53
    \end{aligned}
- id: probability-statistics-conditional-expectation-and-variance-1-02
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 1
  question: |
    \text{For continuous random variables } X,Y \text{ with joint pdf } f(x,y)=x+y \text{ on } [0,1]^2 \text{ (and } 0 \\
    \text{elsewhere), state the definition of } \E[X\mid Y=y] \text{ via the conditional pdf, and compute it.}
  answer: |
    \begin{aligned}
    f_Y(y) &= \int_0^1 (x+y)\,dx = \dfrac12 + y \\
    f_{X\mid Y}(x\mid y) &= \dfrac{f(x,y)}{f_Y(y)} = \dfrac{x+y}{\tfrac12+y} \\
    \E[X\mid Y=y] &= \int_0^1 x\, f_{X\mid Y}(x\mid y)\,dx = \dfrac{\int_0^1 (x^2+xy)\,dx}{\tfrac12+y} = \dfrac{\tfrac13+\tfrac{y}{2}}{\tfrac12+y} = \dfrac{2+3y}{3+6y}
    \end{aligned}
- id: probability-statistics-conditional-expectation-and-variance-1-03
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 1
  question: |
    \text{Using the joint pmf from the table below, state the tower property } \E[X] = \E\big[\E[X\mid Y]\big], \\
    \text{and verify it by computing both sides.}
    \begin{array}{c|cc}
     & Y=1 & Y=2 \\
    \hline
    X=1 & 0.1 & 0.3 \\
    X=2 & 0.2 & 0.4
    \end{array}
  answer: |
    \begin{aligned}
    \E[X\mid Y=1] &= \dfrac53 \ (\text{computed above}), \qquad \E[X\mid Y=2] = 1\cdot\dfrac{0.3}{0.7}+2\cdot\dfrac{0.4}{0.7} = \dfrac{11}{7} \\
    \E\big[\E[X\mid Y]\big] &= \dfrac53(0.3) + \dfrac{11}{7}(0.7) = 0.5+1.1 = 1.6
    \end{aligned} \\
    \text{Directly: } \P(X=1)=0.4,\ \P(X=2)=0.6, \text{ so } \E[X] = 1(0.4)+2(0.6) = 1.6. \text{ The two match.}
- id: probability-statistics-conditional-expectation-and-variance-1-04
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 1
  question: |
    \text{Using the same joint pmf (} X,Y \text{ as above), state the definition of } \Var(X\mid Y=y) \text{ and} \\
    \text{compute } \Var(X\mid Y=1).
  answer: |
    \begin{aligned}
    \Var(X\mid Y=y) &= \E[X^2\mid Y=y] - \big(\E[X\mid Y=y]\big)^2 \\
    \E[X^2\mid Y=1] &= 1^2\cdot\dfrac13 + 2^2\cdot\dfrac23 = \dfrac13+\dfrac83 = 3 \\
    \Var(X\mid Y=1) &= 3 - \left(\dfrac53\right)^2 = 3-\dfrac{25}{9} = \dfrac{2}{9}
    \end{aligned}
- id: probability-statistics-conditional-expectation-and-variance-1-05
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 1
  question: |
    \text{State what } \E[X\mid Y] \text{ and } \Var(X\mid Y) \text{ simplify to when } X \text{ and } Y \text{ are independent.}
  answer: |
    \E[X\mid Y] = \E[X], \qquad \Var(X\mid Y) = \Var(X) \\
    \text{(conditioning on } Y \text{ gives no information about } X \text{ when they're independent, so both the} \\
    \text{conditional mean and conditional variance collapse to the unconditional ones).}
- id: probability-statistics-conditional-expectation-and-variance-2-01
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 2
  question: |
    \text{For discrete } X,Y \text{ with the joint pmf below, write down the distribution of the random} \\
    \text{variable } \E[X\mid Y] \text{ — its value and probability for each value of } Y \text{ — then use it to verify} \\
    \E\big[\E[X\mid Y]\big] = \E[X].
    \begin{array}{c|cc}
     & Y=0 & Y=1 \\
    \hline
    X=0 & 0.2 & 0.3 \\
    X=1 & 0.1 & 0.4
    \end{array}
  answer: |
    \begin{aligned}
    \P(Y=0) &= 0.3, \qquad \P(Y=1) = 0.7 \\
    \E[X\mid Y=0] &= \dfrac{1\cdot 0.1}{0.3} = \dfrac13, \qquad \E[X\mid Y=1] = \dfrac{1\cdot 0.4}{0.7} = \dfrac47
    \end{aligned} \\
    \text{So } \E[X\mid Y] \text{ is the random variable taking value } \tfrac13 \text{ w.p. } 0.3 \text{ and } \tfrac47 \text{ w.p. } 0.7\text{:} \\
    \begin{aligned}
    \E\big[\E[X\mid Y]\big] &= \dfrac13(0.3)+\dfrac47(0.7) = 0.1+0.4 = 0.5
    \end{aligned} \\
    \text{Directly, } \P(X=1)=0.1+0.4=0.5=\E[X], \text{ matching.}
- id: probability-statistics-conditional-expectation-and-variance-2-02
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 2
  question: |
    \text{Given that } \E[X\mid Y=y] = 3y^2 \text{ for all } y, \text{ use "taking out what's known" to compute} \\
    \E[5Y\cdot X \mid Y=y].
  answer: |
    \E[g(Y)X\mid Y] = g(Y)\,\E[X\mid Y] \text{ with } g(Y)=5Y, \text{ so} \\
    \E[5Y\cdot X\mid Y=y] = 5y \cdot \E[X\mid Y=y] = 5y\cdot 3y^2 = 15y^3
- id: probability-statistics-conditional-expectation-and-variance-2-03
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 2
  question: |
    \text{Given } \E[X\mid Y=y] = 2y \text{ and } \E[Z\mid Y=y] = y+1, \text{ use linearity of conditional expectation to} \\
    \text{compute } \E[3X - 2Z \mid Y=y].
  answer: |
    \E[3X-2Z\mid Y=y] = 3\,\E[X\mid Y=y] - 2\,\E[Z\mid Y=y] = 3(2y) - 2(y+1) = 4y-2
- id: probability-statistics-conditional-expectation-and-variance-2-04
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 2
  question: |
    \text{A fair coin determines which of two components a part comes from. Given } Y=1 \text{ (prob } \tfrac12 \text{),} \\
    X \text{ is uniform on } \{0,1,2\}\text{; given } Y=2 \text{ (prob } \tfrac12\text{), } X \text{ is uniform on } \{10,11,12\}. \text{ Use the} \\
    \text{law of total variance to find } \Var(X).
  answer: |
    \begin{aligned}
    \E[X\mid Y=1] &= 1, \qquad \Var(X\mid Y=1) = \dfrac{(0-1)^2+(1-1)^2+(2-1)^2}{3} = \dfrac23 \\
    \E[X\mid Y=2] &= 11, \qquad \Var(X\mid Y=2) = \dfrac23 \ (\text{same shape, shifted})
    \end{aligned} \\
    \begin{aligned}
    \E\big[\Var(X\mid Y)\big] &= \dfrac23 \\
    \Var\big(\E[X\mid Y]\big) &= \dfrac{(1-6)^2+(11-6)^2}{2} = 25 \qquad (\E[X\mid Y] \text{ is } 1 \text{ or } 11, \text{ each w.p. } \tfrac12) \\
    \Var(X) &= \E\big[\Var(X\mid Y)\big] + \Var\big(\E[X\mid Y]\big) = \dfrac23 + 25 = \dfrac{77}{3}
    \end{aligned}
- id: probability-statistics-conditional-expectation-and-variance-2-05
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 2
  question: |
    \text{Let } (X,Y) \text{ be uniform on the triangular region } \{0\le x\le y\le 1\}, \text{ with joint pdf } f(x,y)=2 \\
    \text{on that region. Find } \E[X\mid Y=y].
  answer: |
    \begin{aligned}
    f_Y(y) &= \int_0^y 2\,dx = 2y, \qquad f_{X\mid Y}(x\mid y) = \dfrac{2}{2y} = \dfrac1y \text{ for } 0\le x\le y
    \end{aligned} \\
    \text{So } X\mid Y=y \sim \text{Uniform}(0,y), \text{ hence } \E[X\mid Y=y] = \dfrac{y}{2}.
- id: probability-statistics-conditional-expectation-and-variance-2-06
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 2
  question: |
    \text{The number of customers } N \text{ takes values } 1,2,3 \text{ with probabilities } 0.2,0.5,0.3. \text{ Each} \\
    \text{customer independently spends an amount with mean } \$10, \text{ and } S \text{ is the total amount spent.} \\
    \text{Use the tower property to find } \E[S].
  answer: |
    \begin{aligned}
    \E[S\mid N=n] &= 10n \quad (\text{sum of } n \text{ iid amounts, each mean } 10) \\
    \E[N] &= 1(0.2)+2(0.5)+3(0.3) = 2.1 \\
    \E[S] &= \E\big[\E[S\mid N]\big] = \E[10N] = 10\,\E[N] = 21
    \end{aligned}
- id: probability-statistics-conditional-expectation-and-variance-3-01
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 3
  question: |
    \text{Prove the tower property for discrete random variables: } \E\big[\E[X\mid Y]\big] = \E[X].
  answer: |
    \begin{aligned}
    \E\big[\E[X\mid Y]\big] &= \sum_y \E[X\mid Y=y]\,\P(Y=y) \\
    &= \sum_y \left(\sum_x x\,\P(X=x\mid Y=y)\right)\P(Y=y) \\
    &= \sum_y \sum_x x\,\P(X=x\mid Y=y)\,\P(Y=y) \\
    &= \sum_y \sum_x x\,\P(X=x,Y=y) \qquad (\text{since } \P(X=x\mid Y=y)\P(Y=y) = \P(X=x,Y=y)) \\
    &= \sum_x x \sum_y \P(X=x,Y=y) = \sum_x x\,\P(X=x) = \E[X]
    \end{aligned}
- id: probability-statistics-conditional-expectation-and-variance-3-02
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 3
  question: |
    \text{Prove "taking out what's known": } \E[g(Y)X\mid Y] = g(Y)\,\E[X\mid Y] \text{ for any function } g.
  answer: |
    \text{Fix } Y=y. \text{ Since } Y \text{ is given, } g(Y)=g(y) \text{ is just a constant inside the conditional} \\
    \text{expectation, so by linearity of (conditional) expectation:} \\
    \begin{aligned}
    \E[g(Y)X\mid Y=y] &= \E[g(y)X\mid Y=y] = g(y)\,\E[X\mid Y=y]
    \end{aligned} \\
    \text{This holds for every value } y, \text{ so as a function of } Y\text{: } \E[g(Y)X\mid Y] = g(Y)\,\E[X\mid Y].
- id: probability-statistics-conditional-expectation-and-variance-3-03
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 3
  question: |
    \text{Prove the law of total variance (Eve's law): } \Var(X) = \E\big[\Var(X\mid Y)\big] + \Var\big(\E[X\mid Y]\big).
  answer: |
    \begin{aligned}
    \E[X^2] &= \E\big[\E[X^2\mid Y]\big] \qquad (\text{tower property applied to } X^2) \\
    &= \E\Big[\Var(X\mid Y) + \big(\E[X\mid Y]\big)^2\Big] \qquad (\text{since } \Var(X\mid Y)=\E[X^2\mid Y]-(\E[X\mid Y])^2) \\
    &= \E\big[\Var(X\mid Y)\big] + \E\Big[\big(\E[X\mid Y]\big)^2\Big]
    \end{aligned} \\
    \text{Also } (\E[X])^2 = \big(\E[\E[X\mid Y]]\big)^2 \text{ by the tower property. Subtracting:} \\
    \begin{aligned}
    \Var(X) &= \E[X^2]-(\E[X])^2 \\
    &= \E\big[\Var(X\mid Y)\big] + \E\Big[(\E[X\mid Y])^2\Big] - \big(\E[\E[X\mid Y]]\big)^2 \\
    &= \E\big[\Var(X\mid Y)\big] + \Var\big(\E[X\mid Y]\big)
    \end{aligned}
- id: probability-statistics-conditional-expectation-and-variance-3-04
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 3
  question: |
    \text{Prove that if } X \text{ and } Y \text{ are independent, then } \E[X\mid Y] = \E[X] \text{ almost surely.}
  answer: |
    \text{Independence means } \P(X=x\mid Y=y) = \P(X=x) \text{ for every } x,y \text{ with } \P(Y=y)>0 \text{ (the} \\
    \text{conditional distribution of } X \text{ given } Y=y \text{ equals its marginal distribution). Then for every} \\
    \text{such } y\text{:} \\
    \begin{aligned}
    \E[X\mid Y=y] &= \sum_x x\,\P(X=x\mid Y=y) = \sum_x x\,\P(X=x) = \E[X]
    \end{aligned} \\
    \text{Since this holds for every } y \text{ in the support of } Y, \ \E[X\mid Y] = \E[X] \text{ almost surely.}
- id: probability-statistics-conditional-expectation-and-variance-3-05
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 3
  question: |
    \text{Prove that among all functions } g, \text{ the choice } g(Y)=\E[X\mid Y] \text{ minimizes the mean squared} \\
    \text{error } \E\big[(X-g(Y))^2\big].
  answer: |
    \text{Let } m(Y)=\E[X\mid Y]. \text{ For any function } g\text{:} \\
    \begin{aligned}
    \E\big[(X-g(Y))^2\big] &= \E\big[\big((X-m(Y)) + (m(Y)-g(Y))\big)^2\big] \\
    &= \E\big[(X-m(Y))^2\big] + 2\,\E\big[(X-m(Y))(m(Y)-g(Y))\big] + \E\big[(m(Y)-g(Y))^2\big]
    \end{aligned} \\
    \text{The cross term vanishes: conditioning on } Y \text{ and using "taking out what's known" (} m(Y)-g(Y) \\
    \text{is a function of } Y\text{):} \\
    \begin{aligned}
    \E\big[(X-m(Y))(m(Y)-g(Y))\mid Y\big] &= (m(Y)-g(Y))\,\E[X-m(Y)\mid Y] = (m(Y)-g(Y))\big(m(Y)-m(Y)\big) = 0
    \end{aligned} \\
    \text{so by the tower property the cross term's unconditional expectation is also } 0. \text{ Hence} \\
    \begin{aligned}
    \E\big[(X-g(Y))^2\big] &= \E\big[(X-m(Y))^2\big] + \E\big[(m(Y)-g(Y))^2\big] \ge \E\big[(X-m(Y))^2\big]
    \end{aligned} \\
    \text{with equality iff } g(Y)=m(Y) \text{ a.s. So } g(Y)=\E[X\mid Y] \text{ is the MSE-minimizing predictor.}
- id: probability-statistics-conditional-expectation-and-variance-4-01
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 4
  question: |
    \text{An insurance portfolio receives } N\sim\text{Poisson}(\lambda) \text{ claims. Claim sizes } X_1,X_2,\dots \text{ are iid} \\
    \text{with mean } \mu \text{ and variance } \sigma^2, \text{ independent of } N. \text{ Let } S=\sum_{i=1}^N X_i \text{ be the total claim} \\
    \text{amount. Find } \E[S] \text{ and } \Var(S).
  answer: |
    \begin{aligned}
    \E[S\mid N=n] &= n\mu, \qquad \Var(S\mid N=n) = n\sigma^2 \qquad (\text{sum of } n \text{ iid terms}) \\
    \E[S] &= \E\big[\E[S\mid N]\big] = \E[\mu N] = \mu\lambda \qquad (\E[N]=\lambda \text{ for Poisson}) \\
    \E\big[\Var(S\mid N)\big] &= \E[\sigma^2 N] = \sigma^2\lambda \\
    \Var\big(\E[S\mid N]\big) &= \Var(\mu N) = \mu^2\Var(N) = \mu^2\lambda \qquad (\Var(N)=\lambda \text{ for Poisson}) \\
    \Var(S) &= \E\big[\Var(S\mid N)\big] + \Var\big(\E[S\mid N]\big) = \sigma^2\lambda + \mu^2\lambda = \lambda(\sigma^2+\mu^2)
    \end{aligned}
- id: probability-statistics-conditional-expectation-and-variance-4-02
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 4
  question: |
    \text{Roll a fair die to get } N\in\{1,\dots,6\}, \text{ then flip a fair coin } N \text{ times. Let } H \text{ be the number of} \\
    \text{heads. Find } \E[H] \text{ and } \Var(H).
  answer: |
    \begin{aligned}
    \E[N] &= \dfrac{1+2+3+4+5+6}{6} = \dfrac72, \qquad \E[N^2] = \dfrac{1+4+9+16+25+36}{6} = \dfrac{91}{6} \\
    \Var(N) &= \dfrac{91}{6} - \left(\dfrac72\right)^2 = \dfrac{182}{12}-\dfrac{147}{12} = \dfrac{35}{12}
    \end{aligned} \\
    \text{Given } N=n, \ H\mid N=n \sim \text{Binomial}(n,\tfrac12), \text{ so } \E[H\mid N]=\dfrac{N}{2}, \ \Var(H\mid N)=\dfrac{N}{4}\text{:} \\
    \begin{aligned}
    \E[H] &= \E\left[\dfrac{N}{2}\right] = \dfrac{7}{4} \\
    \E\big[\Var(H\mid N)\big] &= \E\left[\dfrac{N}{4}\right] = \dfrac{7}{8}, \qquad \Var\big(\E[H\mid N]\big) = \Var\left(\dfrac{N}{2}\right) = \dfrac{\Var(N)}{4} = \dfrac{35}{48} \\
    \Var(H) &= \dfrac78 + \dfrac{35}{48} = \dfrac{42}{48}+\dfrac{35}{48} = \dfrac{77}{48}
    \end{aligned}
- id: probability-statistics-conditional-expectation-and-variance-4-03
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 4
  question: |
    \text{A chicken lays } N\sim\text{Poisson}(\lambda) \text{ eggs. Each egg independently hatches with probability } p. \\
    \text{Let } H \text{ be the number of eggs that hatch. Find } \Var(H).
  answer: |
    \text{Given } N=n, \ H\mid N=n \sim \text{Binomial}(n,p), \text{ so } \E[H\mid N]=pN \text{ and } \Var(H\mid N)=N p(1-p)\text{:} \\
    \begin{aligned}
    \E\big[\Var(H\mid N)\big] &= p(1-p)\,\E[N] = p(1-p)\lambda \\
    \Var\big(\E[H\mid N]\big) &= \Var(pN) = p^2\Var(N) = p^2\lambda \qquad (\Var(N)=\lambda) \\
    \Var(H) &= p(1-p)\lambda + p^2\lambda = \lambda p\big[(1-p)+p\big] = \lambda p
    \end{aligned} \\
    \text{(Consistent with the known fact that thinning a Poisson}(\lambda)\text{ process at rate } p \text{ gives a} \\
    \text{Poisson}(\lambda p) \text{ count, whose variance equals its mean, } \lambda p.\text{)}
- id: probability-statistics-conditional-expectation-and-variance-4-04
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 4
  question: |
    \text{Given the joint pmf of } X,Y \text{ below, find the function } g(Y) \text{ that minimizes } \E[(X-g(Y))^2], \text{ give} \\
    \text{its values } g(1),g(2), \text{ and verify numerically that this beats the constant predictor } g\equiv\E[X].
    \begin{array}{c|cc}
     & Y=1 & Y=2 \\
    \hline
    X=1 & 0.3 & 0.2 \\
    X=2 & 0.1 & 0.4
    \end{array}
  answer: |
    \text{The MSE-minimizing predictor is } g(Y)=\E[X\mid Y]\text{:} \\
    \begin{aligned}
    g(1) &= \E[X\mid Y=1] = \dfrac{1(0.3)+2(0.1)}{0.4} = \dfrac{0.5}{0.4} = 1.25 \\
    g(2) &= \E[X\mid Y=2] = \dfrac{1(0.2)+2(0.4)}{0.6} = \dfrac{1.0}{0.6} = \dfrac53
    \end{aligned} \\
    \text{Its MSE is } \E\big[\Var(X\mid Y)\big]\text{:} \\
    \begin{aligned}
    \Var(X\mid Y=1) &= \dfrac{1(0.3)+4(0.1)}{0.4} - 1.25^2 = 1.75-1.5625=0.1875 \\
    \Var(X\mid Y=2) &= \dfrac{1(0.2)+4(0.4)}{0.6} - \left(\dfrac53\right)^2 = 3-\dfrac{25}{9} = \dfrac29 \\
    \E\big[\Var(X\mid Y)\big] &= 0.1875(0.4) + \dfrac29(0.6) \approx 0.075+0.133 = 0.208
    \end{aligned} \\
    \text{Versus the constant predictor } g\equiv\E[X]=1.5\text{:} \\
    \begin{aligned}
    \E\big[(X-1.5)^2\big] &= 0.25(0.3)+0.25(0.1)+0.25(0.2)+0.25(0.4) = 0.25
    \end{aligned} \\
    \text{Since } 0.208 < 0.25, \text{ conditioning on } Y \text{ gives a strictly better (lower-MSE) predictor.}
- id: probability-statistics-conditional-expectation-and-variance-4-05
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 4
  question: |
    \text{A fair coin is flipped repeatedly until two consecutive heads appear. Find the expected number} \\
    \text{of flips, using conditioning (first-step analysis) on the early flips.}
  answer: |
    \text{Let } E_0 \text{ be the expected number of flips to go from "no useful history" to the first } HH, \text{ and} \\
    \text{let } E_1 \text{ be the expected number of } \textit{additional} \text{ flips needed given the most recent flip was} \\
    \text{a head. Condition on the next flip in each state:} \\
    \begin{aligned}
    E_0 &= 1 + \tfrac12 E_1 + \tfrac12 E_0 \qquad (\text{next flip is H w.p. } \tfrac12\text{, moving to state } 1\text{; T w.p. } \tfrac12\text{, back to state } 0) \\
    E_1 &= 1 + \tfrac12(0) + \tfrac12 E_0 \qquad (\text{next flip is H w.p. } \tfrac12\text{, done; T w.p. } \tfrac12\text{, back to state } 0)
    \end{aligned} \\
    \text{From the first equation: } \tfrac12 E_0 = 1+\tfrac12 E_1 \Rightarrow E_0 = 2+E_1. \text{ Substituting into the second:} \\
    \begin{aligned}
    E_1 &= 1+\tfrac12(2+E_1) = 2+\tfrac12 E_1 \ \Rightarrow\ \tfrac12 E_1 = 2 \ \Rightarrow\ E_1 = 4
    \end{aligned} \\
    \text{So } E_0 = 2+4 = 6\text{: it takes } 6 \text{ flips on average to see the first } HH.
- id: probability-statistics-conditional-expectation-and-variance-4-06
  category: Probability & Statistics
  subtopic: Conditional Expectation and Variance
  level: 4
  question: |
    \text{A coin's bias } P \text{ is itself random, } P\sim\text{Uniform}(0,1). \text{ Given } P=p, \text{ the coin is flipped } n \\
    \text{times independently and } H \text{ is the number of heads. Find } \E[H] \text{ and } \Var(H).
  answer: |
    \text{Given } P=p, \ H\mid P=p \sim \text{Binomial}(n,p), \text{ so } \E[H\mid P]=nP, \ \Var(H\mid P)=nP(1-P). \text{ For} \\
    P\sim\text{Uniform}(0,1)\text{: } \E[P]=\tfrac12, \ \Var(P)=\tfrac{1}{12}, \text{ so } \E[P^2]=\Var(P)+(\E[P])^2 = \tfrac1{12}+\tfrac14=\tfrac13. \\
    \begin{aligned}
    \E[H] &= \E\big[\E[H\mid P]\big] = n\,\E[P] = \dfrac{n}{2} \\
    \E\big[\Var(H\mid P)\big] &= n\,\E[P-P^2] = n\left(\tfrac12-\tfrac13\right) = \dfrac{n}{6} \\
    \Var\big(\E[H\mid P]\big) &= \Var(nP) = n^2\Var(P) = \dfrac{n^2}{12} \\
    \Var(H) &= \dfrac{n}{6} + \dfrac{n^2}{12}
    \end{aligned}
- id: probability-statistics-order-statistics-1-01
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 1
  question: |
    \text{Given an iid sample } X_1, X_2, \ldots, X_n \text{, define the order statistics } X_{(1)} \le X_{(2)} \le \cdots \le X_{(n)}. \\
    \text{What do } X_{(1)} \text{ and } X_{(n)} \text{ represent, and how do they differ from } X_1 \text{ and } X_n?
  answer: |
    \text{The order statistics } X_{(1)}, \ldots, X_{(n)} \text{ are the sample values } X_1,\ldots,X_n \text{ sorted into increasing order:} \\
    X_{(1)} = \min(X_1,\ldots,X_n), \qquad X_{(n)} = \max(X_1,\ldots,X_n). \\
    \text{Unlike } X_1 \text{ and } X_n \text{, which are fixed labels referring to the first and } n\text{-th draws (in whatever} \\
    \text{order they were sampled), } X_{(1)} \text{ and } X_{(n)} \text{ are random variables whose value depends on the} \\
    \text{entire sample — e.g. } X_{(1)} \text{ could equal } X_7 \text{ in one realization and } X_2 \text{ in another.}
- id: probability-statistics-order-statistics-1-02
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 1
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid continuous random variables with CDF } F. \text{ Derive the CDF of the maximum } X_{(n)}.
  answer: |
    \begin{aligned}
    P(X_{(n)} \le x) &= P(X_1 \le x, X_2 \le x, \ldots, X_n \le x) \\
    &= \prod_{i=1}^n P(X_i \le x) \qquad \text{(independence)} \\
    &= [F(x)]^n
    \end{aligned}
- id: probability-statistics-order-statistics-1-03
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 1
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid continuous random variables with CDF } F. \text{ Derive the CDF of the minimum } X_{(1)}.
  answer: |
    \begin{aligned}
    P(X_{(1)} \le x) &= 1 - P(X_{(1)} > x) \\
    &= 1 - P(X_1 > x, \ldots, X_n > x) \\
    &= 1 - \prod_{i=1}^n P(X_i > x) \qquad \text{(independence)} \\
    &= 1 - [1-F(x)]^n
    \end{aligned}
- id: probability-statistics-order-statistics-1-04
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 1
  question: |
    \text{For an iid sample of size } n \text{, express the sample median as an order statistic, for both odd and even } n.
  answer: |
    \begin{aligned}
    &\text{If } n = 2m+1 \text{ is odd, the median is the single middle order statistic: } X_{(m+1)}. \\
    &\text{If } n = 2m \text{ is even, there is no single middle value, so the median is the average of the} \\
    &\text{two middle order statistics: } \dfrac{X_{(m)} + X_{(m+1)}}{2}.
    \end{aligned}
- id: probability-statistics-order-statistics-1-05
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 1
  question: |
    \text{Roll two independent fair six-sided dice, } X_1 \text{ and } X_2. \text{ Find the pmf of } X_{(2)} = \max(X_1,X_2).
  answer: |
    \begin{aligned}
    P(X_{(2)} \le k) &= P(X_1 \le k, X_2 \le k) = \left(\frac{k}{6}\right)^2 \\
    P(X_{(2)} = k) &= P(X_{(2)} \le k) - P(X_{(2)} \le k-1) = \frac{k^2 - (k-1)^2}{36} = \frac{2k-1}{36}
    \end{aligned} \\
    \text{for } k = 1,2,\ldots,6 \text{, e.g. } P(X_{(2)}=1) = \tfrac{1}{36},\ P(X_{(2)}=6) = \tfrac{11}{36}.
- id: probability-statistics-order-statistics-2-01
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 2
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid continuous with CDF } F \text{ and pdf } f. \text{ Differentiate the CDF of } X_{(n)} \text{ to find its pdf.}
  answer: |
    \begin{aligned}
    F_{(n)}(x) &= [F(x)]^n \\
    f_{(n)}(x) &= \frac{d}{dx}[F(x)]^n = n[F(x)]^{n-1} f(x)
    \end{aligned}
- id: probability-statistics-order-statistics-2-02
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 2
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid continuous with CDF } F \text{ and pdf } f. \text{ Differentiate the CDF of } X_{(1)} \text{ to find its pdf.}
  answer: |
    \begin{aligned}
    F_{(1)}(x) &= 1-[1-F(x)]^n \\
    f_{(1)}(x) &= \frac{d}{dx}\Big(1-[1-F(x)]^n\Big) = n[1-F(x)]^{n-1} f(x)
    \end{aligned}
- id: probability-statistics-order-statistics-2-03
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 2
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid } \text{Uniform}(0,1). \text{ Find } \E[X_{(n)}].
  answer: |
    \begin{aligned}
    f_{(n)}(x) &= n x^{n-1}, \quad 0 \le x \le 1 \\
    \E[X_{(n)}] &= \int_0^1 x \cdot n x^{n-1}\,dx = n\int_0^1 x^n\,dx = \frac{n}{n+1}
    \end{aligned}
- id: probability-statistics-order-statistics-2-04
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 2
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid } \text{Uniform}(0,1). \text{ Find } \E[X_{(1)}].
  answer: |
    \begin{aligned}
    f_{(1)}(x) &= n(1-x)^{n-1}, \quad 0 \le x \le 1 \\
    \E[X_{(1)}] &= \int_0^1 x \cdot n(1-x)^{n-1}\,dx
    \end{aligned} \\
    \text{Substituting } u=1-x\text{:} \\
    \begin{aligned}
    \E[X_{(1)}] &= \int_0^1 (1-u)\, n u^{n-1}\,du = n\int_0^1 (u^{n-1}-u^n)\,du = n\left(\frac{1}{n}-\frac{1}{n+1}\right) = \frac{1}{n+1}
    \end{aligned}
- id: probability-statistics-order-statistics-2-05
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 2
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid } \text{Exponential}(\lambda). \text{ Find the distribution of } X_{(1)} = \min(X_1,\ldots,X_n).
  answer: |
    \begin{aligned}
    P(X_{(1)} > x) &= P(X_1>x,\ldots,X_n>x) = \prod_{i=1}^n e^{-\lambda x} = e^{-n\lambda x}
    \end{aligned} \\
    \text{so } X_{(1)} \sim \text{Exponential}(n\lambda).
- id: probability-statistics-order-statistics-2-06
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 2
  question: |
    \text{Let } X_1,X_2 \text{ be iid } \text{Uniform}(0,1) \text{, with order statistics } X_{(1)} \le X_{(2)}. \text{ Using their joint pdf } \\
    f(x_1,x_2) = 2 \text{ on } 0<x_1<x_2<1\text{, find } \E[X_{(2)}-X_{(1)}].
  answer: |
    \begin{aligned}
    \E[X_{(2)}-X_{(1)}] &= \int_0^1\!\!\int_{x_1}^1 (x_2-x_1)\cdot 2\,dx_2\,dx_1 \\
    &= \int_0^1 (1-x_1)^2\,dx_1 \qquad \left(\int_{x_1}^1 2(x_2-x_1)\,dx_2 = (1-x_1)^2\right) \\
    &= \frac{1}{3}
    \end{aligned}
- id: probability-statistics-order-statistics-3-01
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 3
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid continuous with CDF } F. \text{ Derive a formula for } F_{(k)}(x) = P(X_{(k)} \le x) \\
    \text{for general } k\text{, by counting how many of the } X_i \text{ fall below } x.
  answer: |
    \begin{aligned}
    &\text{Let } N(x) = \#\{i : X_i \le x\}. \text{ Since each } X_i \le x \text{ independently with probability } F(x)\text{,} \\
    &N(x) \sim \text{Binomial}(n, F(x)). \\
    &X_{(k)} \le x \iff \text{at least } k \text{ of the } X_i \text{ are } \le x \iff N(x) \ge k. \text{ Therefore}
    \end{aligned} \\
    F_{(k)}(x) = P(N(x) \ge k) = \sum_{j=k}^{n} \binom{n}{j} [F(x)]^j [1-F(x)]^{n-j}
- id: probability-statistics-order-statistics-3-02
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 3
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid continuous with CDF } F \text{ and pdf } f. \text{ Derive the pdf of } X_{(k)} \text{ using a} \\
    \text{combinatorial argument (not by differentiating the CDF sum).}
  answer: |
    \begin{aligned}
    &\text{For } X_{(k)} \text{ to land in a small interval } [x, x+dx]\text{, exactly one of the } n \text{ points must fall in} \\
    &[x,x+dx]\text{, exactly } k-1 \text{ of the remaining points must fall below } x\text{, and the other } n-k \text{ must} \\
    &\text{fall above. The number of ways to assign the } n \text{ labeled points to these three roles (1 point} \\
    &\text{in the interval, } k-1 \text{ below, } n-k \text{ above) is the multinomial coefficient } \frac{n!}{1!\,(k-1)!\,(n-k)!}.
    \end{aligned} \\
    \text{Each such assignment has probability } f(x)\,dx \cdot [F(x)]^{k-1} \cdot [1-F(x)]^{n-k}\text{, so} \\
    f_{(k)}(x) = \frac{n!}{(k-1)!\,(n-k)!}\,[F(x)]^{k-1}[1-F(x)]^{n-k} f(x)
- id: probability-statistics-order-statistics-3-03
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 3
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid continuous with pdf } f. \text{ Derive the joint pdf of all } n \text{ order statistics} \\
    X_{(1)} < X_{(2)} < \cdots < X_{(n)}.
  answer: |
    \begin{aligned}
    &\text{The unordered sample } (X_1,\ldots,X_n) \text{ has joint density } \prod_{i=1}^n f(x_i) \text{ on all of } \R^n\text{.} \\
    &\text{Because the } X_i \text{ are continuous, ties occur with probability } 0\text{, so for any fixed ordered tuple} \\
    &x_1 < x_2 < \cdots < x_n\text{, exactly one of the } n! \text{ permutations of labels } (1,\ldots,n) \text{ assigns} \\
    &(X_1,\ldots,X_n) \text{ to each of the } n! \text{ orderings of } (x_1,\ldots,x_n)\text{, and by exchangeability each} \\
    &\text{such permutation contributes the same density } \prod_{i=1}^n f(x_i)\text{. Summing the } n! \text{ equal} \\
    &\text{contributions gives the density of the ordered tuple:}
    \end{aligned} \\
    f_{(1),\ldots,(n)}(x_1,\ldots,x_n) = n!\prod_{i=1}^n f(x_i), \qquad x_1 < x_2 < \cdots < x_n
- id: probability-statistics-order-statistics-3-04
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 3
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid } \text{Uniform}(0,1). \text{ Show that } X_{(k)} \sim \text{Beta}(k, n-k+1) \text{, and use the Beta} \\
    \text{mean to find } \E[X_{(k)}].
  answer: |
    \begin{aligned}
    &\text{Specializing the general pdf } f_{(k)}(x) = \frac{n!}{(k-1)!(n-k)!}[F(x)]^{k-1}[1-F(x)]^{n-k}f(x) \text{ to} \\
    &F(x)=x,\ f(x)=1 \text{ on } [0,1]\text{:}
    \end{aligned} \\
    f_{(k)}(x) = \frac{n!}{(k-1)!(n-k)!}\, x^{k-1}(1-x)^{n-k}, \qquad 0 \le x \le 1 \\
    \begin{aligned}
    &\text{This is exactly the } \text{Beta}(a,b) \text{ density } \frac{\Gamma(a+b)}{\Gamma(a)\Gamma(b)}x^{a-1}(1-x)^{b-1} \text{ with } a=k,\, b=n-k+1\text{,} \\
    &\text{since } \frac{\Gamma(n+1)}{\Gamma(k)\Gamma(n-k+1)} = \frac{n!}{(k-1)!(n-k)!}\text{. So } X_{(k)} \sim \text{Beta}(k,n-k+1)\text{, and using the} \\
    &\text{Beta mean } \frac{a}{a+b}\text{:}
    \end{aligned} \\
    \E[X_{(k)}] = \frac{k}{k+(n-k+1)} = \frac{k}{n+1}
- id: probability-statistics-order-statistics-3-05
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 3
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid with a continuous, strictly increasing CDF } F\text{. Show that } U_{(k)} = F(X_{(k)}) \\
    \text{has the same distribution as the } k\text{-th order statistic of } n \text{ iid } \text{Uniform}(0,1) \text{ variables.}
  answer: |
    \begin{aligned}
    &\text{Since } F \text{ is continuous and strictly increasing, } U_i = F(X_i) \sim \text{Uniform}(0,1) \text{ (probability integral} \\
    &\text{transform), and } U_1,\ldots,U_n \text{ are independent because the } X_i \text{ are.} \\
    &\text{Since } F \text{ is strictly increasing, it preserves order: } X_i < X_j \iff F(X_i) < F(X_j)\text{. So applying } F\\
    &\text{to every } X_i \text{ does not change which one is the } k\text{-th smallest — it just relabels values — hence} \\
    &F(X_{(k)}) = U_{(k)}\text{, the } k\text{-th order statistic of } U_1,\ldots,U_n.
    \end{aligned} \\
    \text{Therefore } U_{(k)} = F(X_{(k)}) \sim \text{Beta}(k, n-k+1)\text{, the same distribution as for a uniform sample.}
- id: probability-statistics-order-statistics-4-01
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 4
  question: |
    \text{Components } 1,\ldots,n \text{ have independent failure times } T_i \sim \text{Exponential}(\lambda_i). \text{ Find the} \\
    \text{distribution of } T = \min(T_1,\ldots,T_n) \text{ and } P(T_i \text{ is the smallest}).
  answer: |
    \begin{aligned}
    P(T > t) &= \prod_{i=1}^n P(T_i > t) = \prod_{i=1}^n e^{-\lambda_i t} = e^{-\left(\sum_i \lambda_i\right)t}
    \end{aligned} \\
    \text{so } T \sim \text{Exponential}\Big(\textstyle\sum_i \lambda_i\Big). \\
    \text{For the probability component } i \text{ fails first, condition on } T_i=t \text{ and integrate over its density:} \\
    \begin{aligned}
    P(T_i = \min) &= \int_0^\infty \lambda_i e^{-\lambda_i t} \prod_{j \ne i} P(T_j > t)\,dt = \int_0^\infty \lambda_i e^{-\lambda_i t}\, e^{-\sum_{j\ne i}\lambda_j t}\,dt \\
    &= \lambda_i \int_0^\infty e^{-(\sum_j \lambda_j)t}\,dt = \frac{\lambda_i}{\sum_j \lambda_j}
    \end{aligned}
- id: probability-statistics-order-statistics-4-02
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 4
  question: |
    \text{A stick of length 1 is broken at two independent } \text{Uniform}(0,1) \text{ points. Find the probability that} \\
    \text{the three resulting pieces can form a triangle.}
  answer: |
    \begin{aligned}
    &\text{Let } X_{(1)} \le X_{(2)} \text{ be the order statistics of the two break points, with joint pdf } 2 \text{ on} \\
    &0<x_1<x_2<1\text{. The three piece lengths are } L_1=X_{(1)},\ L_2=X_{(2)}-X_{(1)},\ L_3=1-X_{(2)}\text{.} \\
    &\text{A triangle forms iff every piece is shorter than } \tfrac12 \text{ (equivalently, no piece exceeds the sum} \\
    &\text{of the other two), i.e. } X_{(1)} < \tfrac12,\ X_{(2)} > \tfrac12,\ X_{(2)}-X_{(1)} < \tfrac12.
    \end{aligned} \\
    \text{For fixed } x_1 \in (0,\tfrac12)\text{, the condition } \max(x_1,\tfrac12) < x_2 < \min(1,x_1+\tfrac12) \text{ becomes} \\
    \tfrac12 < x_2 < x_1+\tfrac12\text{, an interval of length } x_1\text{. So} \\
    \begin{aligned}
    P(\text{triangle}) = \int_0^{1/2} 2x_1\,dx_1 = \left[x_1^2\right]_0^{1/2} = \frac{1}{4}
    \end{aligned}
- id: probability-statistics-order-statistics-4-03
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 4
  question: |
    \text{Observe iid continuous } X_1, X_2, \ldots, X_n \text{ one at a time. Call } X_i \text{ a "record" if it exceeds every} \\
    \text{value observed before it (} X_1 \text{ is automatically a record). Find the expected number of records.}
  answer: |
    \begin{aligned}
    &\text{Let } I_i = \mathbf{1}\{X_i \text{ is a record}\} = \mathbf{1}\{X_i = \max(X_1,\ldots,X_i)\}. \text{ Among the first } i \text{ values,} \\
    &\text{all } i! \text{ orderings are equally likely by exchangeability, so each of the } i \text{ positions is equally} \\
    &\text{likely to hold the maximum: } P(I_i=1) = \dfrac{1}{i}\text{, regardless of the } n-i \text{ values not yet seen.}
    \end{aligned} \\
    \text{By linearity of expectation, the expected number of records } R = \sum_{i=1}^n I_i \text{ is} \\
    \E[R] = \sum_{i=1}^n \E[I_i] = \sum_{i=1}^n \frac{1}{i} = H_n
- id: probability-statistics-order-statistics-4-04
  category: Probability & Statistics
  subtopic: Order Statistics
  level: 4
  question: |
    \text{Let } X_1,\ldots,X_n \text{ be iid } \text{Uniform}(0,1). \text{ Find } \E[X_{(n)} - X_{(1)}] \text{, the expected range of the sample.}
  answer: |
    \text{Using } \E[X_{(n)}] = \dfrac{n}{n+1} \text{ and } \E[X_{(1)}] = \dfrac{1}{n+1}\text{:} \\
    \begin{aligned}
    \E[X_{(n)}-X_{(1)}] = \E[X_{(n)}] - \E[X_{(1)}] = \frac{n}{n+1} - \frac{1}{n+1} = \frac{n-1}{n+1}
    \end{aligned}
