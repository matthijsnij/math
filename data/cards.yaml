- id: mathematics-exponents-and-logarithms-2-02
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 2
  question: |
    \text{Solve for } x: \quad 2^{x+1} = 5
  answer: |
    \begin{aligned}
    2^{x+1} &= 5 \\
    (x+1)\ln 2 &= \ln 5 \\
    x &= \dfrac{\ln 5}{\ln 2} - 1
    \end{aligned}
- id: mathematics-exponents-and-logarithms-2-03
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 2
  question: |
    \text{Solve for } x: \quad \log_{10}(x) + \log_{10}(x-3) = 1
  answer: |
    \begin{aligned}
    \log_{10}\big(x(x-3)\big) &= 1 \\
    x(x-3) &= 10 \\
    x^{2} - 3x - 10 &= 0 \\
    (x-5)(x+2) &= 0 \\
    x &= 5 \ \text{or} \ x=-2 \\
    &\text{domain requires } x>3 \text{, so } x=-2 \text{ is extraneous} \\
    x &= 5
    \end{aligned}
- id: mathematics-exponents-and-logarithms-2-04
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 2
  question: |
    \text{A radioactive sample has a half-life of 10 years. How many years until only } \tfrac{1}{8} \text{ of the original amount remains?}
  answer: |
    \begin{aligned}
    \left(\tfrac12\right)^{t/10} &= \tfrac18 = \left(\tfrac12\right)^{3} \\
    t/10 &= 3 \\
    t &= 30 \text{ years}
    \end{aligned}
- id: mathematics-exponents-and-logarithms-2-05
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 2
  question: |
    \text{Solve: } \left(\tfrac12\right)^{x} < \left(\tfrac12\right)^{3}
  answer: |
    \begin{aligned}
    \left(\tfrac12\right)^x &< \left(\tfrac12\right)^3 \\
    x &> 3 \quad \text{(base } 0<b<1 \text{ reverses the inequality)}
    \end{aligned}
- id: mathematics-exponents-and-logarithms-2-06
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 2
  question: |
    \text{pH is defined as } \mathrm{pH} = -\log_{10}[\mathrm{H}^+]. \text{ If pH drops from 7 to 4, by what factor does } [\mathrm{H}^+] \text{ increase?}
  answer: |
    [\mathrm{H}^+] \text{ increases by a factor of } 10^{7-4} = 10^{3} = 1000
- id: mathematics-exponents-and-logarithms-3-01
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 3
  question: |
    \text{Prove: } \log_b(xy) = \log_b(x) + \log_b(y) \quad (x,y>0,\ b>0,\ b\neq1)
  answer: |
    \begin{aligned}
    \text{let } m &= \log_b(x), \ n = \log_b(y), \quad \text{so } b^m = x, \ b^n = y \\
    xy &= b^m \cdot b^n = b^{m+n} \\
    \text{by the definition of log, } \log_b(xy) &= m+n = \log_b(x) + \log_b(y)
    \end{aligned}
- id: mathematics-exponents-and-logarithms-3-02
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 3
  question: |
    \text{Derive the change-of-base formula: } \log_b(x) = \dfrac{\log_c(x)}{\log_c(b)} \quad (b,c>0,\ b,c\neq1,\ x>0)
  answer: |
    \begin{aligned}
    \text{let } y &= \log_b(x), \quad \text{so } b^y = x \\
    \log_c(b^y) &= \log_c(x) \\
    y \log_c(b) &= \log_c(x) \quad \text{(power rule)} \\
    y &= \dfrac{\log_c(x)}{\log_c(b)}, \quad \text{i.e. } \log_b(x) = \dfrac{\log_c(x)}{\log_c(b)}
    \end{aligned}
- id: mathematics-exponents-and-logarithms-3-03
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 3
  question: |
    \text{For } a \neq 0, \text{ prove that consistency with the exponent law } a^{m-n} = \dfrac{a^m}{a^n} \text{ forces } a^{0} = 1.
  answer: |
    \begin{aligned}
    \text{set } m&=n \text{ in the law: } a^{m-m} = \dfrac{a^m}{a^m} \\
    a^{0} &= \dfrac{a^m}{a^m} = 1 \quad \text{(valid since } a^m \neq 0 \text{ for } a \neq 0\text{)} \\
    &\text{this holds for every } m\text{, so } a^0=1 \text{ is the only value consistent with the law}
    \end{aligned}
- id: mathematics-exponents-and-logarithms-3-04
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 3
  question: |
    \text{Prove that } \log_b(x) \text{ is strictly increasing on } (0,\infty) \text{ when } b>1, \text{ and strictly decreasing when } 0<b<1.
  answer: |
    \begin{aligned}
    &\text{case } b>1: \text{ let } x_1 < x_2, \ t_i = \log_b(x_i), \text{ so } b^{t_i}=x_i \\
    &\text{since } b>1, \ b^{\epsilon} \geq 1 \text{ for } \epsilon \geq 0, \text{ so } s \mapsto b^s \text{ is non-decreasing} \\
    &\text{if } t_1 \geq t_2 \text{ this gives } x_1 \geq x_2, \text{ contradicting } x_1<x_2 \\
    &\text{so } t_1 < t_2, \text{ i.e. } \log_b \text{ is strictly increasing} \\
    &\text{case } 0<b<1: \ b^{\epsilon}<1 \text{ for } \epsilon>0, \text{ so } s \mapsto b^s \text{ is strictly decreasing} \\
    &\text{the mirrored argument gives } \log_b(x_1) > \log_b(x_2) \text{ whenever } x_1<x_2: \text{ strictly decreasing}
    \end{aligned}
- id: mathematics-exponents-and-logarithms-4-01
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 4
  question: |
    \text{How many digits does } 2^{1000} \text{ have? (Use } \log_{10}2 \approx 0.30103.)
  answer: |
    \begin{aligned}
    \text{digits}(N) &= \lfloor \log_{10}N \rfloor + 1 \quad \text{for positive integer } N \\
    \log_{10}(2^{1000}) &= 1000 \cdot \log_{10}2 \approx 1000 \times 0.30103 = 301.03 \\
    \text{digits} &= \lfloor 301.03 \rfloor + 1 = 302
    \end{aligned}
- id: mathematics-exponents-and-logarithms-4-02
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 4
  question: |
    \text{Given } \log_{10}2 \approx 0.301 \text{ and } \log_{10}3 \approx 0.477, \text{ estimate } \log_{10}5 \text{ without a calculator.}
  answer: |
    \begin{aligned}
    \log_{10}5 &= \log_{10}\!\left(\dfrac{10}{2}\right) = \log_{10}10 - \log_{10}2 \\
    &= 1 - 0.301 = 0.699
    \end{aligned}
- id: mathematics-exponents-and-logarithms-4-03
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 4
  question: |
    \text{Investment A doubles every 6 years. Investment B compounds continuously at an annual rate of 10\%. Both start at the same value } V_0. \text{ After 20 years, which is worth more, and by what ratio (A:B)?}
  answer: |
    \begin{aligned}
    A(t) &= V_0 \cdot 2^{t/6} = V_0\, e^{(\ln 2/6)\,t}, \quad B(t) = V_0\, e^{0.1t} \\
    \dfrac{A(t)}{B(t)} &= e^{\left(\frac{\ln 2}{6}-0.1\right)t}, \quad \dfrac{\ln 2}{6} \approx \dfrac{0.6931}{6} \approx 0.1155 \\
    \dfrac{A(20)}{B(20)} &= e^{(0.1155-0.1)\cdot 20} = e^{0.310} \approx 1.36 \\
    &\text{A is worth more, by a ratio of about } 1.36:1
    \end{aligned}
- id: mathematics-exponents-and-logarithms-4-04
  category: Mathematics
  subtopic: Exponents and Logarithms
  level: 4
  question: |
    \text{Solve for } x,y>0 \text{ with } x \neq y: \quad x^{y}=y^{x} \text{ and } y=2x.
  answer: |
    \begin{aligned}
    x^y &= y^x \ \Rightarrow\ y\ln x = x\ln y \\
    \text{substitute } y&=2x: \quad 2x\ln x = x\ln(2x) \\
    \text{divide by } x: \quad 2\ln x &= \ln 2 + \ln x \ \Rightarrow\ \ln x = \ln 2 \ \Rightarrow\ x=2 \\
    y&=2x=4 \quad \text{(check: } 2^4=16=4^2\text{)}
    \end{aligned}
- id: mathematics-functions-and-graphs-1-01
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Find the domain of } f(x) = \dfrac{\sqrt{x+3}}{x-2}.
  answer: |
    \begin{aligned}
    &\text{Need } x+3 \ge 0 \text{ and } x-2 \neq 0 \\
    &\Rightarrow x \ge -3 \text{ and } x \neq 2 \\
    &\text{Domain: } [-3,2)\cup(2,\infty)
    \end{aligned}
- id: mathematics-functions-and-graphs-1-02
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Find the range of } f(x) = -2(x-1)^{2}+5.
  answer: |
    \text{Vertex form, opens downward, vertex } (1,5) \Rightarrow \text{Range: } (-\infty, 5]
- id: mathematics-functions-and-graphs-1-03
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Find the x- and y-intercepts of } f(x) = x^{2}-5x+6.
  answer: |
    \begin{aligned}
    &\text{x-intercepts: } x^{2}-5x+6=0 \Rightarrow (x-2)(x-3)=0 \Rightarrow x=2,\ 3 \\
    &\text{y-intercept: } f(0)=6
    \end{aligned}
- id: mathematics-functions-and-graphs-1-04
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Determine whether } f(x) = x^{4}-3x^{2} \text{ is even, odd, or neither.}
  answer: |
    \begin{aligned}
    f(-x) &= (-x)^{4}-3(-x)^{2} = x^{4}-3x^{2} = f(x) \\
    &\Rightarrow f \text{ is even}
    \end{aligned}
- id: mathematics-functions-and-graphs-1-05
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Which of the following relations is NOT a function of } x? \\
    \text{(a) } y=x^{2}+1 \qquad \text{(b) } x=y^{2} \qquad \text{(c) } y=\sqrt{x} \qquad \text{(d) } y=|x|-2
  answer: |
    \text{(b), since } x=y^{2} \text{ gives } y=\pm\sqrt{x} \text{ — a vertical line at } x>0 \text{ meets the graph twice.}
- id: mathematics-functions-and-graphs-1-06
  category: Mathematics
  subtopic: Functions and Graphs
  level: 1
  question: |
    \text{Let } f(x)=2x+1 \text{ and } g(x)=x^{2}-3. \text{ Evaluate } (f\circ g)(2).
  answer: |
    \begin{aligned}
    g(2) &= 2^{2}-3 = 1 \\
    (f\circ g)(2) &= f(1) = 2(1)+1 = 3
    \end{aligned}
- id: mathematics-functions-and-graphs-2-01
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Find the inverse of } f(x) = \dfrac{2x+3}{x-1}.
  answer: |
    \begin{aligned}
    y &= \dfrac{2x+3}{x-1} \\
    y(x-1) &= 2x+3 \\
    xy-2x &= y+3 \\
    x(y-2) &= y+3 \\
    x &= \dfrac{y+3}{y-2} \\
    \Rightarrow f^{-1}(x) &= \dfrac{x+3}{x-2}
    \end{aligned}
- id: mathematics-functions-and-graphs-2-02
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Find the vertical asymptote(s) of } f(x) = \dfrac{1}{x^{2}-4}.
  answer: |
    \begin{aligned}
    &x^{2}-4=0 \Rightarrow x=\pm2 \\
    &\text{Numerator is nonzero at } x=\pm2 \Rightarrow \text{vertical asymptotes } x=2,\ x=-2
    \end{aligned}
- id: mathematics-functions-and-graphs-2-03
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Find the horizontal asymptote of } f(x) = \dfrac{3x^{2}+1}{x^{2}-4}.
  answer: |
    \begin{aligned}
    &\text{Degrees of numerator and denominator are equal (both 2)} \\
    &\Rightarrow \text{horizontal asymptote } y = \dfrac{3}{1} = 3
    \end{aligned}
- id: mathematics-functions-and-graphs-2-04
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Show that } f(x) = x^{3}+x \text{ is one-to-one on } \R.
  answer: |
    \begin{aligned}
    f'(x) &= 3x^{2}+1 > 0 \text{ for all } x \\
    &\Rightarrow f \text{ is strictly increasing} \Rightarrow f \text{ is one-to-one}
    \end{aligned}
- id: mathematics-functions-and-graphs-2-05
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Find the period of } f(x) = \sin(2x) + \cos(3x).
  answer: |
    \begin{aligned}
    &\text{Period of } \sin(2x): \dfrac{2\pi}{2}=\pi, \qquad \text{Period of } \cos(3x): \dfrac{2\pi}{3} \\
    &\text{Smallest common period: } T=2\pi \quad \left(2\pi = 2\cdot\pi = 3\cdot\tfrac{2\pi}{3}\right)
    \end{aligned}
- id: mathematics-functions-and-graphs-2-06
  category: Mathematics
  subtopic: Functions and Graphs
  level: 2
  question: |
    \text{Describe how the graph of } y=|x| \text{ is transformed to obtain } y=-2|x+3|-1.
  answer: |
    \text{Shift left 3} \quad\Rightarrow\quad \text{vertical stretch by factor 2} \quad\Rightarrow\quad \text{reflect over the x-axis} \quad\Rightarrow\quad \text{shift down 1}
- id: mathematics-functions-and-graphs-3-01
  category: Mathematics
  subtopic: Functions and Graphs
  level: 3
  question: |
    \text{Prove that a strictly monotonic function } f:\R\to\R \text{ is injective.}
  answer: |
    \begin{aligned}
    &\text{WLOG let } f \text{ be strictly increasing. Suppose } f(a)=f(b) \text{ with } a\neq b. \\
    &\text{WLOG } a<b. \text{ Strict increase gives } f(a)<f(b), \text{ contradicting } f(a)=f(b). \\
    &\text{So } a=b, \text{ i.e. } f \text{ is injective. (Strictly decreasing case is symmetric.)}
    \end{aligned}
- id: mathematics-functions-and-graphs-3-02
  category: Mathematics
  subtopic: Functions and Graphs
  level: 3
  question: |
    \text{Prove that if } f \text{ and } g \text{ are injective, then } f\circ g \text{ is injective.}
  answer: |
    \begin{aligned}
    \text{Suppose } (f\circ g)(a) &= (f\circ g)(b) \\
    f(g(a)) &= f(g(b)) \\
    \Rightarrow g(a) &= g(b) \quad (f \text{ injective}) \\
    \Rightarrow a &= b \quad (g \text{ injective})
    \end{aligned}
- id: mathematics-functions-and-graphs-3-03
  category: Mathematics
  subtopic: Functions and Graphs
  level: 3
  question: |
    \text{Find the oblique (slant) asymptote of } f(x) = \dfrac{x^{2}+2x+3}{x+1}.
  answer: |
    \begin{aligned}
    \dfrac{x^{2}+2x+3}{x+1} &= (x+1) + \dfrac{2}{x+1} \quad \text{(polynomial division)} \\
    &\text{As } x\to\pm\infty,\ \dfrac{2}{x+1}\to 0 \\
    &\Rightarrow \text{oblique asymptote: } y = x+1
    \end{aligned}
- id: mathematics-functions-and-graphs-3-04
  category: Mathematics
  subtopic: Functions and Graphs
  level: 3
  question: |
    \text{Classify the discontinuity at the indicated point for each:} \\
    \text{(a) } f(x)=\dfrac{x^{2}-4}{x-2} \text{ at } x=2 \qquad
    \text{(b) } g(x)=\dfrac{1}{x-2} \text{ at } x=2 \\
    \text{(c) } h(x)=\begin{cases} x & x<1 \\ x+2 & x\ge1 \end{cases} \text{ at } x=1
  answer: |
    \begin{aligned}
    &\text{(a) } f(x)=\dfrac{(x-2)(x+2)}{x-2}=x+2 \text{ for } x\neq2,\ \lim_{x\to2}f(x)=4 \text{ exists but } f(2) \text{ undefined} \Rightarrow \text{removable} \\
    &\text{(b) } \lim_{x\to2^{\pm}}\dfrac{1}{x-2}=\pm\infty \Rightarrow \text{infinite discontinuity} \\
    &\text{(c) } \lim_{x\to1^{-}}h(x)=1,\ \lim_{x\to1^{+}}h(x)=3,\ \text{both finite but unequal} \Rightarrow \text{jump discontinuity}
    \end{aligned}
- id: mathematics-functions-and-graphs-4-01
  category: Mathematics
  subtopic: Functions and Graphs
  level: 4
  question: |
    \text{A function } f:\R\to\R \text{ satisfies } f(x+y)=f(x)f(y) \text{ for all real } x,y, \text{ and } f(1)=2. \\
    \text{Find } f(0) \text{ and } f(n) \text{ for every integer } n.
  answer: |
    \begin{aligned}
    &\text{Set } x=y=0: f(0)=f(0)^{2} \Rightarrow f(0)=0 \text{ or } 1 \\
    &\text{If } f(0)=0, \text{ then } f(x)=f(x)f(0)=0\ \forall x, \text{ contradicting } f(1)=2 \Rightarrow f(0)=1 \\
    &\text{For } n\ge1: f(n)=f(\underbrace{1+\cdots+1}_{n})=f(1)^{n}=2^{n} \\
    &\text{Also } f(x)f(-x)=f(0)=1 \Rightarrow f(-n)=\dfrac{1}{f(n)}=2^{-n} \\
    &\Rightarrow f(n)=2^{n} \text{ for every integer } n
    \end{aligned}
- id: mathematics-functions-and-graphs-4-02
  category: Mathematics
  subtopic: Functions and Graphs
  level: 4
  question: |
    \text{A function } f \text{ defined on positive reals satisfies } f(xy)=f(x)+f(y) \text{ for all } x,y>0, \\
    \text{and } f(2)=1. \text{ Find } f(64).
  answer: |
    \begin{aligned}
    64 &= 2^{6} \\
    f(2^{k}) &= f(2\cdot2^{k-1}) = f(2)+f(2^{k-1}) \Rightarrow f(2^{k})=k\,f(2) \text{ by induction} \\
    f(64) &= f(2^{6}) = 6\cdot f(2) = 6
    \end{aligned}
- id: mathematics-functions-and-graphs-4-03
  category: Mathematics
  subtopic: Functions and Graphs
  level: 4
  question: |
    \text{Let } f(x)=x^{2}-2. \text{ Find all real solutions to } f(f(x))=x.
  answer: |
    \begin{aligned}
    &\text{Any fixed point of } f \text{ satisfies } f(f(x))=x, \text{ so } f(x)-x \text{ divides } f(f(x))-x: \\
    &f(f(x))-x = x^{4}-4x^{2}-x+2 = (x^{2}-x-2)(x^{2}+x-1) \\
    &x^{2}-x-2=0 \Rightarrow x=2,\,-1 \quad \text{(fixed points of } f\text{)} \\
    &x^{2}+x-1=0 \Rightarrow x=\dfrac{-1\pm\sqrt5}{2} \quad \text{(genuine period-2 points)} \\
    &\Rightarrow x \in \left\{2,\,-1,\,\dfrac{-1+\sqrt5}{2},\,\dfrac{-1-\sqrt5}{2}\right\}
    \end{aligned}
- id: mathematics-functions-and-graphs-4-04
  category: Mathematics
  subtopic: Functions and Graphs
  level: 4
  question: |
    \text{The graph below shows } y=f(x). \text{ Using the graph, determine:} \\
    \text{(a) the interval(s) where } f \text{ is strictly decreasing} \\
    \text{(b) } f(-3) \\
    \text{(c) whether } f \text{ is invertible on its full domain, and why} \\[1em]
    \includegraphics[width=8cm,height=6.4cm]{/static/graphs/mathematics-functions-and-graphs-4-04.png}
  answer: |
    \begin{aligned}
    &\text{(a) } f \text{ is strictly decreasing on } (-\infty, 0) \\
    &\text{(b) } f(-3) = |-3| = 3 \\
    &\text{(c) Not invertible: e.g. } f(-2)=2 \text{ and } f(x)=2 \text{ for every } x>2 \text{ too} \Rightarrow f \text{ is not one-to-one}
    \end{aligned}
- id: probability-statistics-combinatorics-1-01
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 1
  question: |
    \text{In how many ways can 6 different books be arranged in a row on a shelf?}
  answer: |
    6! = 720
- id: probability-statistics-combinatorics-1-02
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 1
  question: |
    \text{In how many ways can a president and a vice-president be chosen, in that order,} \\
    \text{from 8 candidates?}
  answer: |
    \dfrac{8!}{(8-2)!} = 8 \cdot 7 = 56
- id: probability-statistics-combinatorics-1-03
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 1
  question: |
    \text{In how many ways can a committee of 4 people be chosen from a group of 10?}
  answer: |
    \binom{10}{4} = \dfrac{10!}{4! \, 6!} = 210
- id: probability-statistics-combinatorics-1-04
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 1
  question: |
    \text{A menu offers 3 starters, 5 mains, and 2 desserts. How many different three-course} \\
    \text{meals (one of each) are possible?}
  answer: |
    3 \cdot 5 \cdot 2 = 30
- id: probability-statistics-combinatorics-1-05
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 1
  question: |
    \text{How many distinct arrangements are there of the letters in the word MISSISSIPPI?}
  answer: |
    \text{11 letters: M}{=}1,\ \text{I}{=}4,\ \text{S}{=}4,\ \text{P}{=}2 \\
    \dfrac{11!}{1! \, 4! \, 4! \, 2!} = 34650
- id: probability-statistics-combinatorics-2-01
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 2
  question: |
    \text{In how many distinct ways can 6 people be seated around a circular table, where} \\
    \text{rotations of a seating are considered the same?}
  answer: |
    \text{Fix one person to remove rotational symmetry, arrange the rest:} \\
    (6-1)! = 5! = 120
- id: probability-statistics-combinatorics-2-02
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 2
  question: |
    \text{In how many ways can 10 identical candies be distributed among 4 distinct children,} \\
    \text{where some children may receive none?}
  answer: |
    \text{Stars and bars with } n=10 \text{ items, } k=4 \text{ boxes:} \\
    \binom{n+k-1}{k-1} = \binom{13}{3} = 286
- id: probability-statistics-combinatorics-2-03
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 2
  question: |
    \text{A 4-character password is formed from the 26 letters of the alphabet, with repetition} \\
    \text{allowed. How many distinct passwords are possible?}
  answer: |
    \text{Each of the 4 positions is filled independently from 26 choices:} \\
    26^{4} = 456976
- id: probability-statistics-combinatorics-2-04
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 2
  question: |
    \text{A committee of 5 people is chosen from a group of 12 that includes a specific person,} \\
    \text{Alice. How many such committees include Alice?}
  answer: |
    \text{Alice's seat is fixed, so choose the remaining 4 members from the other 11:} \\
    \binom{11}{4} = 330
- id: probability-statistics-combinatorics-2-05
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 2
  question: |
    \text{A committee of 5 people is chosen from a group of 8 men and 4 women. How many} \\
    \text{committees include at least one woman?}
  answer: |
    \text{Total committees minus committees with no woman:} \\
    \binom{12}{5} - \binom{8}{5} = 792 - 56 = 736
- id: probability-statistics-combinatorics-3-01
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 3
  question: |
    \text{5 boys and 3 girls are to be arranged in a row such that no two girls sit next to} \\
    \text{each other. In how many ways can this be done?}
  answer: |
    \begin{aligned}
    &\text{Arrange the 5 boys first: } 5! \text{ ways.} \\
    &\text{This creates 6 gaps (including the two ends) around the boys.} \\
    &\text{Place the 3 girls into 3 of these 6 gaps, in order: } P(6,3) = 6 \cdot 5 \cdot 4 = 120 \\
    &\text{Total: } 5! \cdot 120 = 120 \cdot 120 = 14400
    \end{aligned}
- id: probability-statistics-combinatorics-3-02
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 3
  question: |
    \text{How many integers from 1 to 100 are divisible by 3 or by 5?}
  answer: |
    \begin{aligned}
    &A = \{\text{divisible by 3}\}, \ B = \{\text{divisible by 5}\} \\
    &|A| = \left\lfloor \dfrac{100}{3} \right\rfloor = 33, \quad |B| = \left\lfloor \dfrac{100}{5} \right\rfloor = 20 \\
    &|A \cap B| = \left\lfloor \dfrac{100}{15} \right\rfloor = 6 \\
    &|A \cup B| = |A| + |B| - |A \cap B| = 33 + 20 - 6 = 47
    \end{aligned}
- id: probability-statistics-combinatorics-3-03
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 3
  question: |
    \text{In how many ways can 5 distinct letters be placed into 5 addressed envelopes (one} \\
    \text{letter per envelope) such that no letter ends up in its correct envelope?}
  answer: |
    \begin{aligned}
    &\text{This counts derangements } D_n \text{ of } n=5 \text{ items:} \\
    &D_n = n! \sum_{k=0}^{n} \dfrac{(-1)^{k}}{k!} \\
    &D_5 = 120 \left(1 - 1 + \dfrac12 - \dfrac16 + \dfrac1{24} - \dfrac1{120}\right) = 120 \cdot \dfrac{11}{30} = 44
    \end{aligned}
- id: probability-statistics-combinatorics-3-04
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 3
  question: |
    \text{A group of 9 distinct students is divided into three project teams of sizes 4, 3,} \\
    \text{and 2. In how many ways can this be done?}
  answer: |
    \text{Multinomial coefficient for groups of sizes 4, 3, 2:} \\
    \dfrac{9!}{4! \, 3! \, 2!} = \dfrac{362880}{24 \cdot 6 \cdot 2} = 1260
- id: probability-statistics-combinatorics-3-05
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 3
  question: |
    \text{In how many ways can 10 identical candies be distributed among 4 distinct children} \\
    \text{so that each child receives at least one candy?}
  answer: |
    \begin{aligned}
    &\text{Give each child one candy first, then distribute the remaining } 10-4=6 \\
    &\text{candies freely among the 4 children (stars and bars, no restriction):} \\
    &\binom{6+4-1}{4-1} = \binom{9}{3} = 84
    \end{aligned}
- id: probability-statistics-combinatorics-4-01
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 4
  question: |
    \text{How many integers from 1 to 200 are divisible by 2, 3, or 5?}
  answer: |
    \begin{aligned}
    &A,B,C = \{\text{divisible by } 2,3,5\} \\
    &|A|=100, \ |B|=66, \ |C|=40 \\
    &|A \cap B|=33 \ (\div 6), \quad |A \cap C|=20 \ (\div 10), \quad |B \cap C|=13 \ (\div 15) \\
    &|A \cap B \cap C| = 6 \ (\div 30) \\
    &|A \cup B \cup C| = 100+66+40-33-20-13+6 = 146
    \end{aligned}
- id: probability-statistics-combinatorics-4-02
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 4
  question: |
    \text{4 married couples (8 people total) are to be seated in a row such that each couple} \\
    \text{sits together. In how many ways can this be done?}
  answer: |
    \begin{aligned}
    &\text{Treat each couple as one block: 4 blocks can be arranged in } 4! \text{ ways.} \\
    &\text{Within each block, the two people can swap order: } 2! \text{ ways per couple, } 2^{4} \text{ total.} \\
    &\text{Total: } 4! \cdot 2^{4} = 24 \cdot 16 = 384
    \end{aligned}
- id: probability-statistics-combinatorics-4-03
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 4
  question: |
    \text{Give a combinatorial (bijective) proof of the hockey-stick identity:} \\
    \sum_{i=r}^{n} \binom{i}{r} = \binom{n+1}{r+1}
  answer: |
    \begin{aligned}
    &\text{The right side counts the } (r{+}1)\text{-element subsets of } \{1,\dots,n+1\}. \\
    &\text{Classify each such subset by its largest element, } i+1, \text{ where } i \text{ ranges from } r \text{ to } n \\
    &\text{(the largest element must be at least } r+1 \text{ to leave room for } r \text{ smaller ones).} \\
    &\text{The remaining } r \text{ elements are then chosen from } \{1,\dots,i\}: \ \binom{i}{r} \text{ ways.} \\
    &\text{Summing over all valid largest elements counts every subset exactly once:} \\
    &\sum_{i=r}^{n} \binom{i}{r} = \binom{n+1}{r+1}
    \end{aligned}
- id: probability-statistics-combinatorics-4-04
  category: Probability & Statistics
  subtopic: Combinatorics
  level: 4
  question: |
    \text{In how many ways can 6 distinct letters be placed into 6 addressed envelopes such} \\
    \text{that exactly 2 letters end up in their correct envelope?}
  answer: |
    \begin{aligned}
    &\text{Choose which 2 letters are correctly placed: } \binom{6}{2} = 15 \\
    &\text{The remaining 4 letters must all be in the wrong envelope: } D_4 = 9 \\
    &\text{Total: } 15 \cdot 9 = 135
    \end{aligned}
