  question: |
    \text{Evaluate: } \int_1^3 (2x+1)\,dx
  answer: |
    \begin{aligned}
    \int_1^3 (2x+1)\,dx &= \left[x^2 + x\right]_1^3 \\
    &= (9+3) - (1+1) = 12 - 2 = 10
    \end{aligned}
